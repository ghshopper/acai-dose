name: Build staff app (Sunmi)

on:
  push:
    branches: [main]
    paths: ['staff_app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still running
concurrency:
  group: staff-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK (Flutter)
        working-directory: staff_app
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee ../build.log
          # Generate the standard Android project files; our own files are kept as they are
          flutter create --org com.acaidose --project-name staff --platforms android . 2>&1 | tee -a ../build.log
          rm -f test/widget_test.dart
          flutter pub get 2>&1 | tee -a ../build.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ../build.log || true
          flutter build apk --release --target-platform android-arm,android-arm64 2>&1 | tee -a ../build.log
          cp build/app/outputs/flutter-apk/app-release.apk ../acai-unsigned.apk

      - name: Build the Karak Dose app (separate install, own name and icon)
        working-directory: staff_app
        run: |
          set -o pipefail
          echo "===== Karak Dose =====" | tee -a ../build.log
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i '/applicationId/s/"com\.acaidose\.staff"/"com.karakdose.staff"/' "$f"
              grep -n "applicationId" "$f" | tee -a ../build.log
            fi
          done
          sed -i 's/android:label="Açaí Dose Staff"/android:label="Karak Dose Staff"/' android/app/src/main/AndroidManifest.xml
          cp -r brand/karak/mipmap-* android/app/src/main/res/
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=SHOP=karak 2>&1 | tee -a ../build.log
          cp build/app/outputs/flutter-apk/app-release.apk ../karak-unsigned.apk

      - name: Sign with the shop key (installs over earlier versions)
        run: |
          set -o pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks staff_app/keystore/acai-staff.jks --ks-pass pass:acaidose-staff \
            --ks-key-alias acai --key-pass pass:acaidose-staff \
            --out acai-dose-staff.apk acai-unsigned.apk 2>&1 | tee -a build.log
          "$BT/apksigner" verify acai-dose-staff.apk 2>&1 | tee -a build.log
          "$BT/apksigner" sign --ks staff_app/keystore/acai-staff.jks --ks-pass pass:acaidose-staff \
            --ks-key-alias acai --key-pass pass:acaidose-staff \
            --out karak-dose-staff.apk karak-unsigned.apk 2>&1 | tee -a build.log
          "$BT/apksigner" verify karak-dose-staff.apk 2>&1 | tee -a build.log

      - name: Publish to the "app-latest" and "karak-latest" releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the file in place (no delete and re-create, so two builds close together can't trip over each other)
          publish() {
            if gh release view "$1" >/dev/null 2>&1; then
              gh release upload "$1" "$2" --clobber
              gh release edit "$1" --notes "$3 Built from ${GITHUB_SHA::7}."
            else
              gh release create "$1" "$2" --title "$4" --notes "$3 Built from ${GITHUB_SHA::7}." --latest=false
            fi
          }
          publish app-latest acai-dose-staff.apk "Install on the Açaí Dose Sunmi device." "Açaí Dose staff app"
          publish karak-latest karak-dose-staff.apk "Install on the Karak Dose Sunmi device." "Karak Dose staff app"

      - name: Keep the build log on the ci-logs branch
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-logs
          git rm -rfq --cached . || true
          git clean -fdxq
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Build log for ${GITHUB_SHA::7} (${{ job.status }})"
          git push -fq origin ci-logs
