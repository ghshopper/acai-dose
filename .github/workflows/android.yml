name: Build staff app (Sunmi)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish to the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk acai-dose-staff.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest acai-dose-staff.apk \
            --title "Açaí Dose staff app" \
            --notes "Install on the Sunmi device. Built from ${GITHUB_SHA::7}." \
            --latest
