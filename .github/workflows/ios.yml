name: Build owner app (iPhone → TestFlight)

# Native SwiftUI app in owner_ios/ (replaces the Flutter owner_app on the same App Store record).
on:
  push:
    branches: [main]
    paths: ['owner_ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        working-directory: owner_ios
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null 2>&1 || brew upgrade xcodegen >/dev/null 2>&1 || true
          xcodebuild -version 2>&1 | tee ../build.log
          xcodegen generate 2>&1 | tee -a ../build.log

      - name: Compile (unsigned check)
        working-directory: owner_ios
        run: |
          set -o pipefail
          xcodebuild -project AcaiOwner.xcodeproj -scheme AcaiOwner -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=$BUILD_NO build > ../compile.log 2>&1 || {
              grep -E "error:|warning: .*unavailable|\*\* BUILD" ../compile.log | head -120 >> ../build.log
              tail -60 ../compile.log >> ../build.log
              exit 1; }
          grep -E "\*\* BUILD" ../compile.log >> ../build.log

      - name: Check the App Store Connect key
        if: env.HAS_KEYS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography >/dev/null 2>&1 || python3 -m pip install --quiet pyjwt cryptography >/dev/null 2>&1
          python3 - <<'PY' 2>&1 | tee -a build.log
          import os, time, json, urllib.request, jwt
          key = os.environ["ASC_KEY_P8"].strip()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          def get(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          st, body = get("/v1/bundleIds?filter[identifier]=com.acaidose.owner,com.acaidose.owner.widgets&limit=10")
          print("ASC key check:", st)
          if st == 200:
              for b in body["data"]: print("  bundle:", b["attributes"]["identifier"], b["attributes"].get("platform"))
          else: print(body)
          st, body = get("/v1/certificates?limit=20")
          print("certificates:", st, [ (c["attributes"]["certificateType"], c["attributes"].get("expirationDate","")[:10]) for c in body["data"]] if st == 200 else body)
          PY

      - name: Archive, sign and upload to TestFlight
        if: env.HAS_KEYS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: owner_ios
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archive unsigned (cloud signing happens at export), then stamp the entitlements (App Group
          # for the widget) on with a local ad-hoc signature so the export keeps them when it re-signs.
          xcodebuild -project AcaiOwner.xcodeproj -scheme AcaiOwner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Owner.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=$BUILD_NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ../archive.log 2>&1 || { grep -E "error:|\*\* ARCHIVE" ../archive.log | head -60 >> ../build.log; tail -40 ../archive.log >> ../build.log; exit 1; }
          grep -E "\*\* ARCHIVE" ../archive.log >> ../build.log
          APP="$RUNNER_TEMP/Owner.xcarchive/Products/Applications/AcaiOwner.app"
          codesign --force --sign - --entitlements Widgets/Widgets.entitlements "$APP/PlugIns/AcaiWidgets.appex" 2>&1 | tee -a ../build.log
          codesign --force --sign - --entitlements App/App.entitlements "$APP" 2>&1 | tee -a ../build.log
          codesign -d --entitlements - "$APP" 2>&1 | tail -8 >> ../build.log
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Owner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}" 2>&1 | tee -a ../build.log || {
              for f in $(ls -d "${TMPDIR:-/tmp}"/AcaiOwner_*.xcdistributionlogs 2>/dev/null) /var/folders/*/*/T/AcaiOwner_*.xcdistributionlogs; do
                [ -d "$f" ] || continue
                echo "---- $f" >> ../build.log
                grep -hiE "error|fail|auth|401|403|profile|certificate" "$f"/*.log 2>/dev/null | grep -v "^\s*$" | head -80 >> ../build.log
              done
              rm -f "$KEY"; exit 1; }
          rm -f "$KEY"

      - name: Keep the build log on the ci-logs-ios branch
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          echo "HAS_KEYS=$HAS_KEYS" >> /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-logs-ios
          git rm -rfq --cached . || true
          git clean -fdxq
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "iOS build log for ${GITHUB_SHA::7} (${{ job.status }})"
          git push -fq origin ci-logs-ios
