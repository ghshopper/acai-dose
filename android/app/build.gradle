plugins {
    id 'com.android.application'
}

android {
    namespace 'com.acaidose.staff'
    compileSdk 34

    defaultConfig {
        applicationId 'com.acaidose.staff'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Internal sideloaded app: a fixed key lets new versions install over old ones.
        staff {
            storeFile file('../keystore/acai-staff.jks')
            storePassword 'acaidose-staff'
            keyAlias 'acai'
            keyPassword 'acaidose-staff'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.staff
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
