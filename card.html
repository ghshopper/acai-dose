<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقة الولاء | Açaí Dose</title>
<meta name="theme-color" content="#470D43">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo-purple.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/app.css?v=1791724891">
<style>
html,body{background:var(--p)}
body{color:var(--c);min-height:100vh}
main{max-width:480px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.logo{width:190px}
.pass{width:100%;background:var(--p2);border-radius:28px;padding:24px 18px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.pass h1{margin:0;font-size:34px}
.who{font-weight:700;color:var(--l)}
.stamps{display:grid;grid-template-columns:repeat(3,64px);gap:14px;justify-content:center;direction:rtl}
.stamps i{width:64px;height:64px;border-radius:50%;border:3px solid var(--l);display:flex;align-items:center;justify-content:center;font-style:normal}
.stamps i.on{background:var(--c);border-color:var(--c)}
.stamps i.on::after{content:'';width:24px;height:28px;background:var(--p);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}
.stamps i.gift{border-color:var(--o);color:var(--o);font-weight:800;font-size:15px}
.stamps i.gift.on{background:var(--o);color:var(--p)}
.stamps i.gift.on::after{display:none}
.msg{font-weight:800;font-size:20px;line-height:1.5}
.free{background:var(--o);color:var(--p);border-radius:16px;padding:12px 18px;font-weight:800;font-size:18px}
.wallet{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:10px 24px;border-radius:14px;background:#000;color:#fff;font-weight:700;font-size:17px;text-decoration:none;font-family:-apple-system,'Montserrat',sans-serif;border:1px solid #444}
.how{font-weight:600;line-height:1.7;opacity:.85;font-size:15px}
.btn.cream{background:var(--c);color:var(--p);border-color:var(--c)}
.lang{align-self:flex-end;min-height:40px;padding:6px 16px;border-radius:999px;border:2px solid var(--c);background:transparent;color:var(--c);font-weight:800;cursor:pointer}
</style>
<script>
(function(){var s=false;function show(t){if(s)return;s=true;var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 12px 12px 12px;z-index:99999;background:#FAF3E0;color:#470D43;padding:14px 16px;border-radius:14px;font:15px/1.5 system-ui,sans-serif';d.textContent='Page could not start: '+t;(document.body||document.documentElement).appendChild(d);}
window.addEventListener('error',function(e){show(e.message||'Script error')});setTimeout(function(){if(!window.__appStarted)show('Please update your browser.')},6000);})();
</script>
</head>
<body>
<main id="main"><p>…</p></main>
<script type="module">
import { api, $, esc, arNum } from './assets/common.js?v=1791724891';
window.__appStarted = true;
(async () => {
const T = {
  ar: { t: 'بطاقة الولاء', of: (a, b) => `${arNum(a)} من ${arNum(b)}`, free: 'مجاني', left: (n, u) => `باقي لك ${arNum(n)} ${u === 'order' ? (n === 1 ? 'طلب' : n === 2 ? 'طلبين' : 'طلبات') : (n === 1 ? 'كوب' : n === 2 ? 'كوبين' : 'أكواب')} وتاخذ كوب مجاني`,
    has: n => n > 1 ? `عندك ${arNum(n)} أكواب مجانية` : 'عندك كوب مجاني!', hasSub: 'ينخصم تلقائياً لما تطلب من موقعنا بنفس الرقم',
    how: (n, u) => `كل ${u === 'order' ? 'طلب' : 'كوب'} تطلبه من موقعنا وتستلمه = ختم. كل ${arNum(n)} أختام = كوب مجاني.`, linked: d => `مربوطة برقم ينتهي بـ ${d}`,
    wallet: 'أضف إلى Apple Wallet', gwallet: 'أضف إلى Google Wallet', order: 'اطلب الحين', missing: 'ما لقينا البطاقة. اطلب من موقعنا وتنعمل لك بطاقة تلقائياً.', sw: 'English' },
  en: { t: 'Loyalty card', of: (a, b) => `${a} of ${b}`, free: 'FREE', left: (n, u) => `${n} more ${u === 'order' ? (n === 1 ? 'order' : 'orders') : (n === 1 ? 'cup' : 'cups')} to a free cup`,
    has: n => n > 1 ? `You have ${n} free cups` : 'You have a free cup!', hasSub: 'Taken off automatically when you order on our site with this number',
    how: (n, u) => `Every ${u === 'order' ? 'order' : 'cup'} you order on our site and pick up = 1 stamp. ${n} stamps = 1 free cup.`, linked: d => `Linked to the number ending ${d}`,
    wallet: 'Add to Apple Wallet', gwallet: 'Add to Google Wallet', order: 'Order now', missing: 'Card not found. Order on our site and a card is made for you.', sw: 'عربي' },
};
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private */ } } };
let lang = ls.get('ad_lang') || ((navigator.language || 'ar').startsWith('ar') ? 'ar' : 'en');
const c = new URLSearchParams(location.search).get('c') || ls.get('ad_card') || '';
let data = null;
if (/^[a-f0-9]{32}$/.test(c)) { try { data = await api('card', undefined, { c }); ls.set('ad_card', c); } catch { data = null; } }

function draw() {
  const L = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const main = $('#main');
  if (!data) {
    main.innerHTML = `<img class="logo" src="assets/logo-cream.png" alt="Açaí Dose"><p class="msg">${L.missing}</p><a class="btn orange" href="./">${L.order}</a>`;
    return;
  }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const full = data.free > 0;
  const dots = Array.from({ length: data.need }, (_, i) => `<i class="${full || i < data.stamps ? 'on' : ''}"></i>`).join('') + `<i class="gift ${full ? 'on' : ''}">${L.free}</i>`;
  main.innerHTML = `
    <button class="lang" id="lang" type="button">${L.sw}</button>
    <img class="logo" src="assets/logo-cream.png" alt="Açaí Dose">
    <section class="pass" aria-label="${L.t}">
      <h1 class="lal">${L.t}</h1>
      ${data.name ? `<div class="who">${esc(data.name)}</div>` : ''}
      <div class="stamps" style="grid-template-columns:repeat(${Math.min(data.need + 1, 3)},64px)">${dots}</div>
      <div class="msg">${full ? '' : L.of(data.stamps, data.need)}</div>
      ${full ? `<div class="free">${L.has(data.free)}<div style="font-size:14px;font-weight:700;margin-top:4px">${L.hasSub}</div></div>` : `<div class="msg" style="font-size:17px">${L.left(data.need - data.stamps, data.unit)}</div>`}
    </section>
    ${data.gwallet && !ios ? `<a class="wallet" href="api/gwallet.php?c=${esc(data.card)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M16 14h2"/></svg>${L.gwallet}</a>` : ''}
    ${data.wallet && ios ? `<a class="wallet" href="api/wallet.php?c=${esc(data.card)}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M16 14h2"/></svg>${L.wallet}</a>` : ''}
    <a class="btn cream" href="./">${L.order}</a>
    <p class="how">${L.how(data.need, data.unit)}<br>${L.linked(lang === 'ar' ? arNum(data.phone_tail) : data.phone_tail)}</p>`;
  $('#lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; ls.set('ad_lang', lang); draw(); };
}
draw();
})();
</script>
</body>
</html>
