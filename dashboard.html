<style>
body{background:var(--c2)}
.shell{display:flex;min-height:100vh}

const app = $('#app');

const me = await requireLogin(app, 'الداشبورد');
if (me.role !== 'owner') { location.href = 'screen.html'; throw 0; }

const CH = { talabat: 'طلبات', snoonu: 'سنونو', khedmah: 'خدمة' };
const CATS = ['مواد خام (آساي وفواكه)', 'أكواب وتغليف', 'رواتب', 'إيجار', 'كهرباء وماء', 'تسويق وإعلانات', 'صيانة', 'أخرى'];

app.innerHTML = `
<div class="shell">
<aside class="side">
  <div class="top"><img class="logo" src="assets/logo-cream.png" alt="Açaí Dose">
    <div class="mlinks"><a href="screen.html">الطلبات</a><a href="pos.html">الكاشير</a><button type="button" data-out>خروج</button></div></div>
  <nav class="tabs" role="tablist" aria-label="أقسام الداش بورد">
    <button role="tab" aria-selected="true" data-t="sum"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>الملخص</span></button>
    <button role="tab" aria-selected="false" data-t="apps"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>إدخال يدوي للتطبيقات</span></button>
    <button role="tab" aria-selected="false" data-t="exp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>المصاريف</span></button>
    <button role="tab" aria-selected="false" data-t="orders"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>كل الطلبات</span></button>
    <button role="tab" aria-selected="false" data-t="cust"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg><span>العملاء</span></button>
    <button role="tab" aria-selected="false" data-t="data"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span>استيراد وتصفير</span></button>
    <button role="tab" aria-selected="false" data-t="set"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>الإعدادات</span></button>
  </nav>
  <div class="links">
    <a href="screen.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>شاشة الطلبات</a>
    <a href="pos.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>الكاشير</a>
    <button type="button" data-out><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg>خروج</button>
    <div class="who" dir="ltr">${esc(me.username)}</div>
  </div>
</aside>
<main class="main"><div class="main-in">
  <div class="head">
    <h1 class="lal" id="ptitle">الملخص</h1>
    <div class="period" id="period">
      <div class="seg" role="group" aria-label="الفترة">
        <button type="button" data-p="today" aria-pressed="true">اليوم</button>
        <button type="button" data-p="yest" aria-pressed="false">أمس</button>
        <button type="button" data-p="week" aria-pressed="false">٧ أيام</button>
        <button type="button" data-p="month" aria-pressed="false">هذا الشهر</button>
        <button type="button" data-p="last" aria-pressed="false">الشهر الماضي</button>
      </div>
      <div class="dates"><input type="date" id="pf" aria-label="من"><span>←</span><input type="date" id="pt" aria-label="إلى"></div>
    </div>
  </div>

  <section data-panel="sum"></section>
  <section data-panel="apps" class="hidden"></section>
  <section data-panel="exp" class="hidden"></section>
  <section data-panel="orders" class="hidden"></section>
  <section data-panel="cust" class="hidden"></section>
  <section data-panel="data" class="hidden"></section>
  <section data-panel="set" class="hidden"></section>
</div></main>
</div>`;

document.querySelectorAll('[data-out]').forEach(b => { b.onclick = logout; });

// ---------- state ----------
let tab = 'sum';
let from, to;   // yyyy-mm-dd inclusive
let commissions = { talabat: 0, snoonu: 0, khedmah: 0 };

function setPeriod(p) {
  const d = new Date(); const t = ymd(d);
  if (p === 'today') { from = to = t; }
  if (p === 'yest') { d.setDate(d.getDate() - 1); from = to = ymd(d); }
  if (p === 'week') { to = t; d.setDate(d.getDate() - 6); from = ymd(d); }
  if (p === 'month') { to = t; from = t.slice(0, 8) + '01'; }
  if (p === 'last') { const s = new Date(d.getFullYear(), d.getMonth() - 1, 1), e = new Date(d.getFullYear(), d.getMonth(), 0); from = ymd(s); to = ymd(e); }
  $('#pf').value = from; $('#pt').value = to;
  $$('#period button[data-p]').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === p));
  refresh();
}
$('#period').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b) setPeriod(b.dataset.p); });
['#pf', '#pt'].forEach(s => $(s).addEventListener('change', () => {
  from = $('#pf').value || from; to = $('#pt').value || to; if (from > to) [from, to] = [to, from];
  $$('#period button[data-p]').forEach(b => b.setAttribute('aria-pressed', 'false')); refresh();
}));

$('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  tab = b.dataset.t;
  $('#ptitle').textContent = b.textContent.trim();
  $$('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  $$('section[data-panel]').forEach(s => s.classList.toggle('hidden', s.dataset.panel !== tab));
  $('#period').classList.toggle('hidden', tab === 'set' || tab === 'data' || tab === 'cust');
  refresh();
});

const days = () => { const out = []; for (let d = new Date(from + 'T00:00:00'); ymd(d) <= to; d.setDate(d.getDate() + 1)) out.push(ymd(d)); return out; };

async function fetchAll() {
  try { return await api('range', undefined, { from, to }); }
  catch (ex) { if (ex.message === 'login_required') location.reload(); return { orders: [], apps: [], exps: [] }; }
}

async function refresh() {
  if (tab === 'set') return drawSettings();
  if (tab === 'data') return drawData();
  if (tab === 'cust') return drawCustomers();
  const d = await fetchAll();
  ({ sum: drawSum, apps: drawApps, exp: drawExp, orders: drawOrders })[tab](d);
}

// ---------- summary ----------
function drawSum({ orders, apps, exps }) {
  const valid = orders.filter(o => o.status !== 'cancelled');
  const isApp = o => o.source === 'pos' && CH[o.payment];
  const webO = valid.filter(o => o.source !== 'pos');
  const shopO = valid.filter(o => o.source === 'pos' && !CH[o.payment]);
  const appO = valid.filter(isApp);
  const sumT = list => list.reduce((s, o) => s + +o.total, 0);
  const cnt = list => list.reduce((s, o) => s + (o.n_orders || 1), 0);
  const cupsOf = list => list.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0);
  const site = sumT(webO), shop = sumT(shopO);

  // Payment methods: cash/card from shop + collected web orders; apps from POS app sales + manual entries
  const methods = [
    { k: 'cash', name: 'نقد', list: valid.filter(o => o.payment === 'cash') },
    { k: 'card', name: 'بطاقة', list: valid.filter(o => o.payment === 'card') },
    ...Object.entries(CH).map(([k, name]) => ({ k, name, list: appO.filter(o => o.payment === k), manual: apps.filter(r => r.channel === k) })),
  ].map(m => {
    const gross = sumT(m.list) + (m.manual || []).reduce((s, r) => s + +r.gross, 0);
    const comm = m.list.reduce((s, o) => s + (+o.commission || 0), 0) + (m.manual || []).reduce((s, r) => s + +r.commission, 0);
    const n = cnt(m.list) + (m.manual || []).reduce((s, r) => s + (r.orders_count || 0), 0);
    return { ...m, gross, comm, net: gross - comm, n, isApp: !!CH[m.k] };
  });
  const unpaidWeb = webO.filter(o => !o.payment);
  const appGross = methods.filter(m => m.isApp).reduce((s, m) => s + m.gross, 0);
  const comm = methods.reduce((s, m) => s + m.comm, 0);
  const exp = exps.reduce((s, r) => s + +r.amount, 0);
  const manualGross = apps.reduce((s, r) => s + +r.gross, 0);
  const sales = sumT(valid) + manualGross, net = sales - comm - exp;

  const prod = {};
  valid.forEach(o => o.items.forEach(i => { prod[i.name_ar] = (prod[i.name_ar] || 0) + i.qty; }));
  const prodRows = Object.entries(prod).sort((a, b) => b[1] - a[1]);

  const ds = days();
  const daily = ds.map(day => {
    const s = valid.filter(o => o.created_at.slice(0, 10) === day).reduce((a, o) => a + +o.total, 0)
      + apps.filter(r => r.sale_date === day).reduce((a, r) => a + +r.gross, 0);
    return { day, s };
  });
  const max = Math.max(1, ...daily.map(x => x.s));

  const nOrders = cnt(valid) + apps.reduce((a, r) => a + (r.orders_count || 0), 0);
  const avg = nOrders ? sales / nOrders : 0;
  const todayStr = ymd(new Date());
  const pct = v => sales > 0 ? Math.max(0, Math.round(v / sales * 100)) : 0;
  const chan = [
    { l: 'الموقع', v: site, s: `${cnt(webO)} طلب · ${cupsOf(webO)} كوب`, ic: '<path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/><circle cx="12" cy="12" r="9"/>' },
    { l: 'المحل', v: shop, s: `${cnt(shopO)} عملية · ${cupsOf(shopO)} كوب`, ic: '<path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M9 20v-6h6v6"/>' },
    { l: 'التطبيقات', v: appGross, s: 'طلبات وسنونو وخدمة', ic: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>' },
  ];
  const svg = d => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${d}</svg>`;
  const maxP = prodRows.length ? prodRows[0][1] : 1;

  $('[data-panel="sum"]').innerHTML = `
    <div class="grid4">
      <div class="card hero ${net < 0 ? 'neg' : ''}">
        <div class="l">صافي الربح</div>
        <div class="v">${money(net)} <small>ر.ع</small></div>
        <div class="flow" role="img" aria-label="المبيعات مقسمة على الصافي والعمولات والمصاريف">
          <i style="width:${sales > 0 ? Math.max(0, net) / sales * 100 : 0}%;background:var(--c)"></i>
          <i style="width:${sales > 0 ? comm / sales * 100 : 0}%;background:var(--o)"></i>
          <i style="width:${sales > 0 ? Math.min(exp, sales) / sales * 100 : 0}%;background:#c86a8a"></i>
        </div>
        <div class="legend"><span><b style="background:var(--c)"></b>الصافي</span><span><b style="background:var(--o)"></b>العمولات ${money(comm)}</span><span><b style="background:#c86a8a"></b>المصاريف ${money(exp)}</span></div>
      </div>
      <div class="card stat"><div class="l">${svg('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>')}إجمالي المبيعات</div><div class="v">${money(sales)}</div><div class="s">${nOrders} طلب · متوسط الطلب ${money(avg)}</div></div>
      <div class="card stat"><div class="l">${svg('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>')}المصاريف</div><div class="v">${money(exp)}</div><div class="s">${exps.length} مصروف</div></div>
      ${chan.map(c => `<div class="card stat"><div class="l">${svg(c.ic)}${c.l}</div><div class="v">${money(c.v)}</div><div class="s">${c.s} · ${pct(c.v)}%</div><div class="share"><i style="width:${pct(c.v)}%"></i></div></div>`).join('')}
      <div class="card stat"><div class="l">${svg('<path d="M4 7h16M4 12h16M4 17h10"/>')}العمولات</div><div class="v">${money(comm)}</div><div class="s">تخصمها التطبيقات</div></div>
    </div>

    <div class="sec"><h3 class="lal">طرق الدفع والحسابات</h3><small>"المفروض يوصلك" = المبيعات ناقص العمولة</small></div>
    <div class="paygrid">
      ${methods.map(m => `<div class="card pay">
        <div class="top"><span>${m.name}</span><span class="tag ${m.isApp ? 't' : ''}">${m.isApp ? 'تحويل' : 'بالدرج'}</span></div>
        <div class="net">${money(m.net)}</div>
        <div class="row"><span>المبيعات</span><span>${money(m.gross)}</span></div>
        ${m.isApp ? `<div class="row"><span>العمولة</span><span>${money(m.comm)}</span></div>` : ''}
        <div class="row"><span>الطلبات</span><span>${m.n}</span></div>
      </div>`).join('')}
      ${unpaidWeb.length ? `<div class="card pay"><div class="top"><span>طلبات موقع للحين</span><span class="tag">غير مستلمة</span></div><div class="net">${money(sumT(unpaidWeb))}</div><div class="row"><span>الطلبات</span><span>${unpaidWeb.length}</span></div></div>` : ''}
    </div>

    ${ds.length > 1 ? `<div class="sec"><h3 class="lal">المبيعات اليومية</h3><small>${money(sales)} ر.ع في ${ds.length} يوم</small></div>
    <div class="card chart" role="img" aria-label="رسم المبيعات اليومية">
      <div class="plot">${daily.map(x => `<div class="b ${x.day === todayStr ? 'today' : ''}" title="${x.day}: ${money(x.s)} ر.ع">${x.s > 0 && ds.length <= 16 ? `<em>${x.s.toFixed(1)}</em>` : ''}<i style="height:${Math.round(x.s / max * 100)}%"></i></div>`).join('')}</div>
      <div class="days">${daily.map(x => `<span>${x.day.slice(8)}</span>`).join('')}</div>
    </div>` : ''}

    <div class="sec"><h3 class="lal">الأكثر طلباً</h3><small>عدد الأكواب</small></div>
    ${prodRows.length ? `<div class="card topp">${prodRows.map(([n, q]) => `<div class="r"><span style="font-weight:800">${esc(n)}</span><div class="bar"><i style="width:${Math.round(q / maxP * 100)}%"></i></div><span class="q">${q}</span></div>`).join('')}</div>` : '<div class="card empty">ما فيه طلبات في هالفترة</div>'}
  `;
}

const IMPORT_ERR = { bad_date: 'التاريخ غلط أو في المستقبل', bad_payment: 'طريقة الدفع غلط', bad_amount: 'المبلغ غلط', bad_orders: 'عدد الطلبات غلط',

function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, bad) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = () => bad(new Error('xlsx_load')); document.head.appendChild(sc);
  });
}
const norm = v => String(v == null ? '' : v).trim().toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/\s+/g, ' ');
const pad = n => String(n).padStart(2, '0');
function toDate(v) {
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const t = String(v == null ? '' : v).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  let m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;   // day/month/year
  return '';
}
const toNum = v => { if (typeof v === 'number') return v; const t = String(v == null ? '' : v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.\-]/g, ''); return t === '' ? NaN : +t; };

async function parseFile(file, products) {
  await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets['المبيعات'] || wb.Sheets[wb.SheetNames[0]];
  const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const hi = grid.findIndex(r => r.some(c => norm(c).includes('التاريخ')));
  if (hi < 0) throw new Error('no_header');
  const H = grid[hi].map(norm);
  const col = (...keys) => H.findIndex(h => keys.some(k => h.includes(norm(k))));
  const ix = { date: col('التاريخ'), pay: col('طريقة الدفع'), amt: col('المبلغ'), n: col('عدد الطلبات'), prod: col('الصنف'), qty: col('الاكواب', 'عدد الأكواب'), pct: col('العمولة'), note: col('ملاحظة', 'ملاحظه') };
  const rows = [], errs = [];
  grid.slice(hi + 1).forEach((r, k) => {
    const line = hi + k + 2, get = i => (i < 0 ? '' : r[i]);
    if ([ix.date, ix.pay, ix.amt].every(i => String(get(i)).trim() === '')) return;   // empty row
    const e = [];
    const date = toDate(get(ix.date)); if (!date) e.push('التاريخ');
    const pw = norm(get(ix.pay)); const payment = Object.keys(PAY_WORDS).find(k2 => PAY_WORDS[k2].some(w => norm(w) === pw)); if (!payment) e.push('طريقة الدفع');
    const amount = toNum(get(ix.amt)); if (!(amount > 0)) e.push('المبلغ');
    const nRaw = get(ix.n); const orders = String(nRaw).trim() === '' ? 1 : Math.round(toNum(nRaw)); if (!(orders >= 1)) e.push('عدد الطلبات');
    let product_id = null, qty = null; const pn = norm(get(ix.prod));
    if (pn) {
      const pr = products.find(x => norm(x.name_ar) === pn) || products.find(x => norm(x.name_ar).includes(pn) || pn.includes(norm(x.name_ar)));
      if (!pr) e.push('الصنف'); else { product_id = pr.id; qty = String(get(ix.qty)).trim() === '' ? orders : Math.round(toNum(get(ix.qty))); if (!(qty >= 1)) e.push('عدد الأكواب'); }
    }
    const pctRaw = get(ix.pct); const commission_pct = String(pctRaw).trim() === '' ? null : toNum(pctRaw);
    if (commission_pct !== null && !(commission_pct >= 0 && commission_pct <= 100)) e.push('العمولة');
    if (e.length) errs.push(`سطر ${line}: ${e.join('، ')}`);
    else rows.push({ date, payment, amount: Math.round(amount * 1000) / 1000, orders, product_id, qty, commission_pct, note: String(get(ix.note)).trim().slice(0, 300) });
  });
  return { rows, errs };
}

      </div>
      <div id="prev"></div>
    </div>

    <h3 class="lal" style="color:var(--bad)">تصفير المبيعات</h3>
    <form class="card" id="rf" style="display:grid;gap:12px;padding:18px;border:2px solid var(--bad)">
      <p style="margin:0;line-height:1.7;font-weight:700">يمسح الطلبات ومبيعات الكاشير والتطبيقات في التواريخ اللي تختارها، ويرجع ترقيم طلبات هالأيام من ١. المنيو والأسعار وحسابات العمال والعمولات تظل مثل ما هي. <span style="color:var(--bad)">ما ينفع التراجع.</span></p>
      <div style="display:flex;gap:18px;flex-wrap:wrap;font-weight:700">
        <label style="display:flex;gap:8px;align-items:center"><input type="radio" name="rm" value="range" checked style="width:22px;height:22px"> تواريخ معينة</label>
        <label style="display:flex;gap:8px;align-items:center"><input type="radio" name="rm" value="all" style="width:22px;height:22px"> كل المبيعات</label>
      </div>
      <div class="formrow" id="rdates" style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field"><label for="rfrom">من تاريخ</label><input id="rfrom" type="date"></div>
        <div class="field"><label for="rto">إلى تاريخ</label><input id="rto" type="date"></div>
      </div>
      <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="rx" style="width:22px;height:22px"> امسح المصاريف بعد (في نفس التواريخ)</label>
      <div class="formrow" style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field"><label for="rp">كلمة السر حقك</label><input id="rp" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="rc">اكتب RESET للتأكيد</label><input id="rc" dir="ltr" autocomplete="off" autocapitalize="characters" required></div>
      </div>
      <button class="btn" type="submit" style="background:var(--bad);border-color:var(--bad);color:#fff">صفّر المبيعات</button>
      <div class="err" id="rerr" role="alert"></div>
    </form>`;

  $('#xf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const prev = $('#prev'); prev.innerHTML = '<p>جاري قراءة الملف…</p>'; parsed = null;
    let products = [];
    try { products = (await api('settings')).products; } catch { /* matching by name will fail */ }
    try { parsed = await parseFile(f, products); }
    catch (ex) { prev.innerHTML = `<div class="err">${ex.message === 'no_header' ? 'ما لقيت عمود «التاريخ». استخدم ملف الإكسل حقنا.' : ex.message === 'xlsx_load' ? 'ما قدرت أفتح الإكسل، تأكد من الإنترنت.' : 'الملف ما انقرأ، تأكد إنه ملف إكسل.'}</div>`; return; }
    const { rows, errs } = parsed;
    const by = {}; rows.forEach(r => { by[r.payment] = (by[r.payment] || 0) + r.amount; });
    const ds = rows.map(r => r.date).sort();
    prev.innerHTML = `
      ${rows.length ? `<p style="font-weight:800;margin:0 0 8px">${rows.length} سطر جاهز${ds.length ? ` · من ${ds[0]} إلى ${ds[ds.length - 1]}` : ''} · المجموع ${money(rows.reduce((s, r) => s + r.amount, 0))} ر.ع</p>
      <div class="tbl-wrap"><table><thead><tr><th>طريقة الدفع</th><th>المبلغ</th></tr></thead>
        <tbody>${Object.entries(by).map(([k, v]) => `<tr><td>${PAY_AR[k]}</td><td class="num">${money(v)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="err">ما لقيت ولا سطر صالح.</p>'}
      ${errs.length ? `<div class="err" style="margin-top:10px">فيه ${errs.length} سطر فيه غلط، صلحه بالملف وارفعه مرة ثانية:<br>${errs.slice(0, 15).map(esc).join('<br>')}${errs.length > 15 ? '<br>…' : ''}</div>` : ''}
      ${rows.length && !errs.length ? '<button class="btn" id="imp" type="button" style="margin-top:12px">أدخل المبيعات</button>' : ''}
      <div class="err" id="ierr" role="status"></div>`;
    const ib = $('#imp');
    if (ib) ib.onclick = async () => {
      if (!confirm(`بندخل ${rows.length} سطر. متأكد؟`)) return;
      ib.disabled = true;
      try {
        const r = await api('import_sales', { rows });
        prev.innerHTML = `<p class="ok" style="font-weight:800">انضافت ${r.count} سطر ✓ — تشوفها في «الملخص» لما تختار الفترة.</p>`;
      } catch (ex) {
        const [ln, code] = String(ex.message).split(':');
        $('#ierr').textContent = code ? `${ln.replace('row_', 'سطر رقم ')}: ${IMPORT_ERR[code] || code}` : msg(ex);
        ib.disabled = false;
      }
    };
    e.target.value = '';
  };

  const today = ymd(new Date()); $('#rfrom').value = $('#rto').value = today; $('#rfrom').max = $('#rto').max = today;
  $$('input[name="rm"]').forEach(r => r.onchange = () => { $('#rdates').style.display = $('input[name="rm"]:checked').value === 'all' ? 'none' : 'flex'; });
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    const err = $('#rerr'); err.style.color = ''; err.textContent = '';
    const all = $('input[name="rm"]:checked').value === 'all';
    let f = $('#rfrom').value, t = $('#rto').value || f;
    if (!all && !f) { err.textContent = 'اختر التاريخ'; return; }
    if (f > t) [f, t] = [t, f];
    if ($('#rc').value.trim() !== 'RESET') { err.textContent = 'اكتب RESET بالإنجليزي حروف كبيرة'; return; }
    const what = all ? 'كل المبيعات' : (f === t ? `مبيعات يوم ${f}` : `المبيعات من ${f} إلى ${t}`);
    if (!confirm(`متأكد؟ بتنمسح ${what} وما تقدر ترجعها.`)) return;
    try {
      await api('reset_sales', { password: $('#rp').value, confirm: 'RESET', expenses: $('#rx').checked, all, from: f, to: t });
      err.style.color = 'var(--ok)'; err.textContent = `تم ✓ انمسحت ${what}.`; e.target.reset(); $('#rdates').style.display = 'flex'; $('#rfrom').value = f || today; $('#rto').value = t || today;
    } catch (ex) { err.textContent = ex.message === 'bad_password' ? 'كلمة السر غلط' : msg(ex); }
  };
}

// ---------- boot ----------
try { Object.assign(commissions, (await api('settings')).commissions); } catch { /* defaults */ }
setPeriod('today');

})();
</script>
</body>
</html>
