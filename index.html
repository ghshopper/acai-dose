<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلب | Açaí Dose</title>
<meta name="theme-color" content="#470D43">
<link rel="icon" href="assets/logo-purple.png">
<link rel="stylesheet" href="assets/app.css">
<style>
body{background:var(--c)}
.hero{background:var(--p);color:var(--c);text-align:center;padding:30px 20px 64px;border-radius:0 0 50% 50% / 0 0 40px 40px}
.hero img{width:180px;max-width:56%}
.hero h1{margin:12px 0 4px;font-size:34px;line-height:1.2}
.hero p{margin:0;font-weight:700;opacity:.85}
main{max-width:520px;margin:-40px auto 0;padding:0 16px 150px;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:2px}
.steps span{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:#fff;border-radius:999px;padding:6px 14px;opacity:.55}
.steps span.on{opacity:1;background:var(--o)}
.item{display:flex;align-items:center;gap:14px;padding:14px}
.item img{width:84px;height:110px;object-fit:contain;flex:none}
.item .info{flex:1;min-width:0}
.item .ar{font-size:23px;line-height:1.25}
.item .en{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.7;direction:ltr;text-align:right}
.item .price{margin-top:6px;font-weight:800;font-size:17px}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:44px;height:44px;border-radius:50%;border:2px solid var(--p);background:#fff;color:var(--p);font-size:24px;font-weight:800;cursor:pointer;line-height:1}
.qty button.add{background:var(--p);color:var(--c)}
.qty span{min-width:22px;text-align:center;font-weight:800;font-size:19px}
.form{padding:20px;display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.phone-row{display:flex;gap:8px;direction:ltr}
.phone-row span{display:flex;align-items:center;padding:0 12px;border:2px solid #e3d6bf;border-radius:16px;background:var(--c2);font-weight:800}
.phone-row input{flex:1;min-width:0;width:100%;direction:ltr;text-align:left}
.plate{direction:ltr;text-align:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.summary{padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.summary .l{display:flex;justify-content:space-between;gap:10px}
.summary button{align-self:flex-start;background:none;border:0;color:var(--p);text-decoration:underline;font-weight:800;cursor:pointer;min-height:40px;padding:0}
.info-box{padding:14px 18px;display:flex;gap:12px;align-items:flex-start;background:var(--l);border-radius:var(--r);font-weight:700;line-height:1.6}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -8px 24px rgba(71,13,67,.12);z-index:5}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1}
.bar .tot b{font-size:22px}
.bar .tot small{display:block;font-weight:700;opacity:.7}
.bar .btn{flex:none;min-width:140px}
.closed{padding:18px;text-align:center;font-weight:800;background:#fff3e0;border-radius:var(--r)}
.track{text-align:center;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:center}
.track .num{font-family:'Montserrat',sans-serif;font-weight:800;font-size:68px;line-height:1}
.prog{display:flex;width:100%;gap:6px;margin:6px 0}
.prog div{flex:1;text-align:center;font-size:13px;font-weight:800;opacity:.45}
.prog div i{display:block;height:8px;border-radius:4px;background:#e8dcc6;margin-bottom:6px}
.prog div.on{opacity:1}
.prog div.on i{background:var(--o)}
.prog div.done i{background:var(--ok)}
.st{font-size:22px}
.here{width:100%;min-height:64px;font-size:20px}
</style>
</head>
<body>
<header class="hero">
  <img src="assets/logo-cream.png" alt="Açaí Dose">
  <h1 class="lal" id="htitle">اختار دوزك</h1>
  <p>استلام من سيارتك في القرم ٢٩ &middot; الدفع عند الاستلام</p>
</header>

<main id="main">
  <div class="steps" id="steps"><span class="on" id="s1">١ المنيو</span><span id="s2">٢ بياناتك</span></div>
  <div id="closed" class="closed hidden">المحل مسكر الحين. نفتح من ٧ الصبح لين ١٢ الليل.</div>

  <section id="step1" aria-label="المنيو">
    <div id="menu" style="display:flex;flex-direction:column;gap:12px">
      <div class="card item" style="justify-content:center;min-height:120px">يحمّل المنيو…</div>
    </div>
  </section>

  <section id="step2" class="hidden" aria-label="بياناتك">
    <div class="card summary" id="summary"></div>
    <form id="form" class="card form" novalidate style="margin-top:14px">
      <div class="row2">
        <div class="field"><label for="car">رقم السيارة</label><input id="car" class="plate" maxlength="20" autocomplete="off" placeholder="12345 A" required></div>
        <div class="field"><label for="cardesc">نوع ولون السيارة</label><input id="cardesc" maxlength="40" placeholder="مثلاً: لاندكروزر أبيض"></div>
      </div>
      <div class="field"><label for="name">الاسم</label><input id="name" autocomplete="name" maxlength="60" required></div>
      <div class="field"><label for="phone">رقم الجوال</label>
        <div class="phone-row"><span>+968</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="8" placeholder="9XXXXXXX" required></div>
      </div>
      <div class="field"><label for="time">وقت الاستلام</label><select id="time"></select></div>
      <div class="field"><label for="notes">ملاحظات (اختياري)</label><textarea id="notes" maxlength="300" placeholder="مثلاً: بدون ثلج"></textarea></div>
    </form>
    <div class="info-box" style="margin-top:14px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <div>توقف قدام المحل في القرم ٢٩ واضغط "وصلت"، ونجيب لك الطلب لين سيارتك. <a href="https://maps.app.goo.gl/gid6wTDGEtdCS21a7" target="_blank" rel="noopener" style="color:var(--p)">الموقع في الخريطة</a></div>
    </div>
  </section>
</main>

<div class="bar" id="bar">
  <div class="in">
    <button class="btn ghost hidden" id="back" type="button" style="min-width:auto">رجوع</button>
    <div class="tot"><small id="count">ما اخترت شي</small><b id="total" class="mon">0.000</b> <span style="font-weight:800">ر.ع</span></div>
    <button class="btn" id="next" type="button" disabled>التالي</button>
  </div>
  <div class="err" id="err" role="alert" style="max-width:520px;margin:6px auto 0;text-align:center"></div>
</div>

<script type="module">
import { api, $, esc, money, arNum } from './assets/common.js';

const cart = new Map();
let products = [], step = 1;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};

function buildTimes() {
  const sel = $('#time'), now = new Date(), opts = [];
  if (now.getHours() >= 7) opts.push(['ASAP', 'بأسرع وقت (١٥ – ٢٠ دقيقة)']);
  const t = new Date(now); t.setMinutes(Math.ceil((t.getMinutes() + 30) / 15) * 15, 0, 0);
  if (t.getHours() < 7) t.setHours(7, 0, 0, 0);
  while (t.getDate() === now.getDate() && opts.length < 40) {
    const hh = t.getHours(), mm = String(t.getMinutes()).padStart(2, '0');
    opts.push([`${String(hh).padStart(2, '0')}:${mm}`, arNum(`${((hh + 11) % 12) + 1}:${mm} ${hh < 12 ? 'ص' : 'م'}`)]);
    t.setMinutes(t.getMinutes() + 15);
  }
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  return opts.length > 0;
}
const isOpen = () => $('#time').options.length > 0;

function totals() {
  let n = 0, tot = 0;
  for (const p of products) { const q = cart.get(p.id) || 0; n += q; tot += q * p.price; }
  return { n, tot };
}
const cupsLabel = n => n ? `${arNum(n)} ${n === 1 ? 'كوب' : n === 2 ? 'كوبين' : 'أكواب'}` : 'ما اخترت شي';

function render() {
  $('#menu').innerHTML = products.map(p => {
    const q = cart.get(p.id) || 0;
    return `<div class="card item">
      <img src="assets/${esc(p.img || 'cup-smoothie.png')}" alt="">
      <div class="info"><div class="ar lal">${esc(p.name_ar)}</div><div class="en mon">${esc(p.name_en)}</div>
        <div class="price"><span class="mon">${money(p.price)}</span> ر.ع</div></div>
      <div class="qty">
        ${q ? `<button type="button" data-id="${p.id}" data-d="-1" aria-label="نقّص ${esc(p.name_ar)}">−</button><span aria-live="polite">${arNum(q)}</span>` : ''}
        <button type="button" class="add" data-id="${p.id}" data-d="1" aria-label="أضف ${esc(p.name_ar)}">+</button>
      </div></div>`;
  }).join('');
  const { n, tot } = totals();
  $('#total').textContent = money(tot);
  $('#count').textContent = cupsLabel(n);
  $('#next').disabled = n === 0 || !isOpen();
}

function goStep(s) {
  step = s;
  $('#step1').classList.toggle('hidden', s !== 1);
  $('#step2').classList.toggle('hidden', s !== 2);
  $('#s1').classList.toggle('on', s === 1); $('#s2').classList.toggle('on', s === 2);
  $('#back').classList.toggle('hidden', s !== 2);
  $('#next').textContent = s === 1 ? 'التالي' : 'أرسل الطلب';
  $('#htitle').textContent = s === 1 ? 'اختار دوزك' : 'بيانات الاستلام';
  $('#err').textContent = '';
  if (s === 2) {
    $('#summary').innerHTML = products.filter(p => cart.get(p.id)).map(p =>
      `<div class="l"><span>${arNum(cart.get(p.id))}× ${esc(p.name_ar)}</span><span class="mon">${money(cart.get(p.id) * p.price)}</span></div>`).join('')
      + '<button type="button" id="edit">عدّل الطلب</button>';
    $('#edit').onclick = () => goStep(1);
    // remember returning customers
    for (const k of ['name', 'phone', 'car', 'cardesc']) { const v = store.get('ad_' + k); if (v && !$('#' + k).value) $('#' + k).value = v; }
    setTimeout(() => ($('#car').value ? $('#name') : $('#car')).focus(), 50);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('#menu').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const id = +b.dataset.id, q = Math.max(0, Math.min(20, (cart.get(id) || 0) + +b.dataset.d));
  q ? cart.set(id, q) : cart.delete(id);
  render();
});
$('#phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8); });
$('#back').onclick = () => goStep(1);

$('#next').addEventListener('click', async () => {
  if (step === 1) return goStep(2);
  const err = $('#err'); err.textContent = '';
  const car = $('#car').value.trim(), name = $('#name').value.trim(), phone = $('#phone').value.trim();
  if (!car) { err.textContent = 'اكتب رقم السيارة'; $('#car').focus(); return; }
  if (name.length < 2) { err.textContent = 'اكتب اسمك'; $('#name').focus(); return; }
  if (!/^[279]\d{7}$/.test(phone)) { err.textContent = 'اكتب رقم جوال عماني من ٨ أرقام'; $('#phone').focus(); return; }
  if (!isOpen()) { err.textContent = 'المحل مسكر الحين'; return; }
  const btn = $('#next'); btn.disabled = true; btn.textContent = 'يرسل…';
  try {
    const r = await api('place_order', {
      name, phone: '+968' + phone, car_plate: car.toUpperCase(), car_desc: $('#cardesc').value.trim(),
      pickup: $('#time').value, notes: $('#notes').value, items: [...cart].map(([product_id, qty]) => ({ product_id, qty })),
    });
    store.set('ad_name', name); store.set('ad_phone', phone); store.set('ad_car', car); store.set('ad_cardesc', $('#cardesc').value.trim());
    store.set('ad_track', r.token);
    showTrack(r.token);
  } catch (ex) {
    err.textContent = ex.message === 'too_many' ? 'طلبات كثيرة من نفس الجهاز، انتظر شوي'
      : ex.message === 'closed' ? 'المحل مسكر الحين' : 'ما قدرنا نرسل الطلب، جرب مرة ثانية';
    btn.disabled = false; btn.textContent = 'أرسل الطلب';
  }
});

// ---------- order tracking ----------
const ST = ['new', 'preparing', 'ready', 'done'];
const ST_TXT = { new: 'وصلنا طلبك، بنبدأ فيه الحين', preparing: 'طلبك يتحضر', ready: 'طلبك جاهز!', done: 'استلمت طلبك، بالعافية', cancelled: 'انلغى الطلب. تواصل معنا لو في شي' };
let trackTimer = null;

function showTrack(token) {
  $('#bar')?.remove(); $('#steps')?.remove();
  $('#htitle').textContent = 'طلبك';
  $('#main').innerHTML = `<div class="card track" id="track" aria-live="polite">يحمّل…</div>`;
  const tick = async () => {
    let o;
    try { o = await api('track', undefined, { t: token }); } catch (ex) { if (ex.message === 'not_found') { store.del('ad_track'); location.reload(); } return; }
    if (!o.today) store.del('ad_track');
    const idx = ST.indexOf(o.status);
    $('#track').innerHTML = `
      <div style="font-weight:700">رقم طلبك</div>
      <div class="num">#${esc(o.ref)}</div>
      <div class="st lal">${ST_TXT[o.status]}</div>
      ${o.status !== 'cancelled' ? `<div class="prog">${['استلمنا', 'يتحضر', 'جاهز', 'استلمته'].map((l, i) =>
        `<div class="${i < idx ? 'done on' : i === idx ? 'on' : ''}"><i></i>${l}</div>`).join('')}</div>` : ''}
      <div style="font-weight:700;line-height:1.7">سيارة: <b dir="ltr" style="unicode-bidi:isolate">${esc(o.car_plate || '')}</b><br>المبلغ: <span class="mon">${money(o.total)}</span> ر.ع، تدفعه عند الاستلام</div>
      ${['new', 'preparing', 'ready'].includes(o.status) ? (o.arrived
        ? '<div class="btn here" style="background:var(--ok)" role="status">بلّغناهم إنك وصلت، جايين لك</div>'
        : '<button class="btn orange here" id="here" type="button">وصلت عند المحل</button>') : ''}
      <a class="btn ghost" href="https://maps.app.goo.gl/gid6wTDGEtdCS21a7" target="_blank" rel="noopener">موقع المحل</a>
      ${['done', 'cancelled'].includes(o.status) ? '<button class="btn" id="again" type="button">طلب جديد</button>' : ''}`;
    $('#here')?.addEventListener('click', async e => {
      e.target.disabled = true;
      try { await api('arrived', { t: token }); tick(); } catch { e.target.disabled = false; }
    });
    $('#again')?.addEventListener('click', () => { store.del('ad_track'); location.reload(); });
    if (['done', 'cancelled'].includes(o.status)) { clearInterval(trackTimer); store.del('ad_track'); }
  };
  tick(); trackTimer = setInterval(tick, 6000);
  window.scrollTo({ top: 0 });
}

(async () => {
  const saved = store.get('ad_track');
  if (saved && /^[a-f0-9]{32}$/.test(saved)) return showTrack(saved);
  const open = buildTimes();
  if (!open) $('#closed').classList.remove('hidden');
  try { products = await api('menu'); }
  catch { $('#menu').innerHTML = '<div class="card item">ما قدرنا نحمّل المنيو، حدّث الصفحة</div>'; return; }
  render();
})();
</script>
</body>
</html>
