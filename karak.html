:root{

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ar);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-en);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}

[dir=ltr] .iconbtn.back svg{transform:scaleX(-1)}

.hero{margin-top:16px;border-radius:26px;background:var(--char);color:#fff;padding:22px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--o),transparent 70%);opacity:.55}

.item .nm{font-weight:600;font-size:16px}
.item .en{font-family:var(--f-en);font-size:12px;color:var(--sub);margin-top:2px}

.plate{direction:ltr;text-align:center;font-family:var(--f-en);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.phone{display:flex;gap:8px;direction:ltr}

.phone input{direction:ltr;text-align:left;font-family:var(--f-en)}
.times{display:flex;gap:8px}
.time{min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.time[aria-pressed=true]{border-color:var(--char);background:var(--card)}
.review{background:var(--card);border-radius:20px;padding:14px 16px;margin-top:18px}
.review .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.where{display:flex;gap:12px;background:#FBEBD6;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.6;margin-top:16px}
.where a{color:var(--char);font-weight:600}

.done{text-align:center;padding-top:20px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--ok)}
.tick svg{width:42px;height:42px}
.ref{font-family:var(--f-en);font-weight:600;font-size:56px;line-height:1;margin-top:14px}
.status{font-size:20px;font-weight:800;margin-top:8px}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:20px 0 6px}
.prog div{font-size:12px;font-weight:600;color:var(--sub);text-align:center}
.prog div i{display:block;height:6px;border-radius:9px;background:var(--line);margin-bottom:8px}
.prog div.on{color:var(--ink)}
.prog div.on i{background:var(--o)}
.prog div.past i{background:var(--ok)}
.info{background:var(--card);border-radius:20px;padding:14px 16px;margin-top:16px}
.info .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;animation:fade .2s;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

function groups(catKey) {
  const out = new Map();
  for (const p of products) if (p.cat === catKey) { const k = p.name_en; if (!out.has(k)) out.set(k, []); out.get(k).push(p); }
  return [...out.values()];
}
const inCart = vs => [...cart.values()].filter(l => vs.some(v => v.id === l.pid)).reduce((a, l) => a + l.qty, 0);
function isOpenNow() { return new Date().getHours() >= openFrom; }
function buildTimes() {
  const now = new Date(), out = [];
  const t = new Date(now); t.setMinutes(Math.ceil((t.getMinutes() + 20) / 15) * 15, 0, 0);
  if (t.getHours() < openFrom) t.setHours(openFrom, 0, 0, 0);
  while (t.getDate() === now.getDate() && out.length < 48) {
    const hh = t.getHours(), mm = String(t.getMinutes()).padStart(2, '0');
    const lbl = `${((hh + 11) % 12) + 1}:${mm} ${hh < 12 ? (lang === 'ar' ? 'ص' : 'AM') : (lang === 'ar' ? 'م' : 'PM')}`;
    out.push([`${String(hh).padStart(2, '0')}:${mm}`, lang === 'ar' ? arNum(lbl) : lbl]);
    t.setMinutes(t.getMinutes() + 15);
  }
  return out;
}

// ---------- views ----------
function header(back) {
  return `<div class="top">
    ${back ? `<button class="iconbtn back" type="button" id="goBack" aria-label="${L.back}">${ICON.back}</button>` : ''}
    <a class="brand" href="./"><img src="assets/karak/logo-dark.png" alt="كرك دوز Karak Dose"></a>
    <button class="pill" type="button" id="lang">${L.en}</button>
  </div>`;
}

function viewMenu() {
  const cur = cat || (cats[0] && cats[0].k) || '';
  const shown = cats.filter(c => products.some(p => p.cat === c.k));
  return `${header(false)}
  <div class="hero"><span class="eyebrow">${L.eyebrow}</span><h1>${L.h1}</h1><p>${L.lead}</p></div>
  ${promo ? `<div class="promo">${esc(lang === 'ar' ? promo.ar : promo.en)}</div>` : ''}
  <nav class="cats" aria-label="Menu">${shown.map(c => `<button type="button" class="cat" data-cat="${esc(c.k)}" aria-pressed="${c.k === cur}">${esc(catName(c))}</button>`).join('')}</nav>
  ${shown.map(c => `<section class="sec" id="sec-${esc(c.k)}"><h2>${esc(catName(c))}<span class="eyebrow">${esc(c.en)}</span></h2>
    ${groups(c.k).map(vs => {
      const p = vs[0], out = vs.every(v => v.soldout), n = inCart(vs);
      const price = vs.map(v => money(v.price)).join(' / ');
      return `<button type="button" class="item${out ? ' out' : ''}" data-g="${esc(p.name_en)}" data-c="${esc(c.k)}"${out ? ' aria-disabled="true"' : ''}>
        <span class="t"><span class="nm">${esc(nm(p))}${out ? `<span class="tag">${L.out}</span>` : ''}</span>${lang === 'ar' ? `<span class="en" style="display:block">${esc(p.name_en)}</span>` : ''}</span>
        <span class="pr">${price}<small>${L.omr}</small></span>
        ${n ? `<span class="q">${n}</span>` : '<span class="add" aria-hidden="true">+</span>'}
      </button>`;
    }).join('')}</section>`).join('')}`;
}

function viewDetails() {
  const { t } = totals();
  const times = buildTimes();
  return `${header(true)}
  <div class="steps"><i class="on"></i><i class="on"></i></div>
  <div class="head"><h1>${L.details}</h1><p class="lead">${L.detLead}</p></div>
  <form class="form" id="form" novalidate>
    <div class="two">
      <div class="field"><label for="car">${L.car}</label><input id="car" class="plate" maxlength="20" autocomplete="off" placeholder="12345 A" value="${esc(form.car)}"><div class="err hidden" id="eCar">${L.eCar}</div></div>
      <div class="field"><label for="cardesc">${L.cardesc}</label><input id="cardesc" maxlength="40" placeholder="${L.cardescPh}" value="${esc(form.cardesc)}"></div>
    </div>
    <div class="field"><label for="name">${L.name}</label><input id="name" autocomplete="name" maxlength="60" value="${esc(form.name)}"><div class="err hidden" id="eName">${L.eName}</div></div>
    <div class="field"><label for="phone">${L.phone}</label><div class="phone"><span>+968</span><input id="phone" type="tel" inputmode="numeric" maxlength="8" placeholder="9XXXXXXX" value="${esc(form.phone)}"></div><div class="err hidden" id="ePhone">${L.ePhone}</div></div>
    <div class="field"><label>${L.time}</label>
      <div class="times">
        <button type="button" class="time" data-time="ASAP" aria-pressed="${form.time === 'ASAP'}">${L.now} · ${L.min}</button>
        <select id="later" aria-label="${L.later}" style="min-height:48px;flex:1;padding:0 12px;border-radius:14px;border:1.5px solid ${form.time !== 'ASAP' ? 'var(--char)' : 'var(--line)'};background:#fff;font-weight:600;font-size:14px">
          <option value="">${L.later}…</option>${times.map(([v, l]) => `<option value="${v}"${form.time === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field"><label for="notes">${L.note}</label><textarea id="notes" maxlength="300" placeholder="${L.notePh}">${esc(form.notes)}</textarea></div>
  </form>
  <div class="review">${[...cart.values()].map(l => `<div class="r"><span>${l.qty}× ${esc(lineName(l))}</span><span class="num">${money(l.qty * (prod(l.pid)?.price || 0))}</span></div>`).join('')}
    <div class="r" style="font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span>${L.total}</span><span class="num">${money(t)} ${L.omr}</span></div></div>
  <div class="where"><div>${L.where} <a href="https://maps.app.goo.gl/YEWkdU1vi8ZtnJua8" target="_blank" rel="noopener">${L.map}</a></div></div>`;
}

function viewTrack() {
  const o = track;
  if (!o) return `${header(false)}<div class="done"><div class="tick">${ICON.check}</div></div>`;
  const i = ST.indexOf(o.status), live = ['new', 'preparing', 'ready'].includes(o.status), cancelled = o.status === 'cancelled';
  const time = !o.pickup_time || o.pickup_time === 'ASAP' ? L.asap : (buildTimes().find(([v]) => v === o.pickup_time) || [0, o.pickup_time])[1];
  const l = o.loyalty;
  return `${header(false)}
  <div class="done">
    <div class="tick"${cancelled ? ' style="color:var(--bad)"' : ''}>${cancelled ? ICON.x : ICON.check}</div>
    <div class="eyebrow" style="color:var(--sub);margin-top:16px">${L.yourNo}</div>
    <div class="ref" dir="ltr">#${esc(o.ref)}</div>
    <div class="status" aria-live="polite">${cancelled ? L.cancelled : L.st[i]}</div>
    ${cancelled ? '' : `<div class="prog">${L.steps.map((s, k) => `<div class="${k < i ? 'on past' : k === i ? 'on' : ''}"><i></i>${s}</div>`).join('')}</div>`}
  </div>
  <div class="info">
    <div class="r"><span>${L.carL}</span><b dir="ltr" class="num">${esc(o.car_plate || '')}</b></div>
    <div class="r"><span>${L.pickup}</span><b>${esc(time)}</b></div>
    <div class="r"><span>${L.amount}</span><b><span class="num">${money(o.total)}</span> ${L.omr} · ${L.pay}</b></div>
  </div>
  ${l && l.on ? `<div class="note">${l.free > 0 ? L.loyFree : L.loyLeftO(l.need - l.stamps)}</div>` : ''}
  <div class="acts">
    ${live ? (o.arrived ? `<div class="btn" style="background:var(--ok)" role="status">${L.told}</div>` : `<button type="button" class="btn o" id="here">${L.here}</button>`) : ''}
    ${shopWa ? `<a class="btn wa" href="https://wa.me/${shopWa.replace(/\D/g, '')}?text=${encodeURIComponent('Hi Karak Dose 👋 About my order #' + o.ref)}" target="_blank" rel="noopener">${L.wa}</a>` : ''}
    <a class="btn ghost" href="https://maps.app.goo.gl/YEWkdU1vi8ZtnJua8" target="_blank" rel="noopener">${L.map}</a>
    ${live ? '' : `<button type="button" class="btn" id="again">${L.again}</button>`}
  </div>`;
}

// ---------- sheets ----------
function sheet(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(bg);
  onMount && onMount(bg, close);
  return close;
}

function openItem(vs) {
  const avail = vs.filter(v => !v.soldout);
  if (!avail.length) return toast(L.out);
  let pick = avail[0], note = '', qty = 1;
  const notes = DRINKS.has(vs[0].cat) ? NOTES_D : NOTES_F;
  const draw = () => `<button type="button" class="iconbtn x" data-close aria-label="×">${ICON.x}</button>
    <h3>${esc(nm(vs[0]))}</h3>${lang === 'ar' ? `<div class="lead">${esc(vs[0].name_en)}</div>` : ''}
    ${vs.length > 1 ? `<div class="lbl">${L.size}</div><div class="sizes">${vs.map(v => `<button type="button" class="size" data-s="${v.id}" aria-pressed="${v === pick}"${v.soldout ? ' disabled' : ''}>${sizeName(v.size)}<span class="num">${v.soldout ? L.out : money(v.price) + ' ' + L.omr}</span></button>`).join('')}</div>` : ''}
    <div class="lbl">${L.notes}</div>
    <div class="notes">${notes.map(([k]) => `<button type="button" class="chip" data-n="${esc(k)}" aria-pressed="${k === note}">${esc(noteName(k))}</button>`).join('')}</div>
    <div class="qty"><button type="button" data-q="-1" aria-label="−">−</button><span>${qty}</span><button type="button" data-q="1" aria-label="+">+</button></div>
    <button type="button" class="btn" id="iadd" style="margin-top:10px">${L.addTo(money(pick.price * qty) + ' ' + L.omr)}</button>`;
  sheet(draw(), (bg, close) => {
    const s = bg.querySelector('.sheet');
    const redraw = () => { s.innerHTML = '<div class="grab"></div>' + draw(); };
    redraw();
    bg.addEventListener('click', e => {
      const sz = e.target.closest('[data-s]'); if (sz) { pick = vs.find(v => v.id === +sz.dataset.s) || pick; return redraw(); }
      const n = e.target.closest('[data-n]'); if (n) { note = note === n.dataset.n ? '' : n.dataset.n; return redraw(); }
      const q = e.target.closest('[data-q]'); if (q) { qty = Math.max(1, Math.min(20, qty + +q.dataset.q)); return redraw(); }
      if (e.target.closest('#iadd')) {
        const key = `${pick.id}::${note}`, cur = cart.get(key);
        cart.set(key, { pid: pick.id, qty: Math.min(20, (cur ? cur.qty : 0) + qty), note });
        if (navigator.vibrate) navigator.vibrate(8);
        close(); render(); toast('✓ ' + lineName({ pid: pick.id, note }));
      }
    });
  });
}

function openCart() {
  const draw = () => {
    const { n, t } = totals();
    return `<button type="button" class="iconbtn x" data-close aria-label="×">${ICON.x}</button>
      <h3>${L.yours}</h3><div class="lead">${L.items(n)}</div>
      <div style="margin-top:8px">${n ? [...cart.entries()].map(([k, l]) => `<div class="line">
        <div class="t">${esc(lineName(l))}<span class="num">${money((prod(l.pid)?.price || 0) * l.qty)} ${L.omr}</span></div>
        <span class="stepper"><button type="button" data-k="${esc(k)}" data-d="-1" aria-label="−">−</button><span>${l.qty}</span><button type="button" data-k="${esc(k)}" data-d="1" aria-label="+">+</button></span></div>`).join('') : `<p class="lead">${L.empty}</p>`}</div>
      <div class="sum"><span>${L.total}</span><span class="num">${money(t)} ${L.omr}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        <button type="button" class="btn" id="toDetails"${n ? '' : ' disabled'}>${L.cont}</button>
        <button type="button" class="btn ghost" data-close>${L.more}</button>
      </div>`;
  };
  sheet(draw(), (bg, close) => {
    const s = bg.querySelector('.sheet');
    bg.addEventListener('click', e => {
      const b = e.target.closest('[data-k]');
      if (b) {
        const l = cart.get(b.dataset.k); if (!l) return;
        l.qty += +b.dataset.d; if (l.qty <= 0) cart.delete(b.dataset.k);
        render(); s.innerHTML = '<div class="grab"></div>' + draw(); if (!totals().n) close();
      }
      if (e.target.closest('#toDetails')) { close(); go('details'); }
    });
  });
}

// ---------- flow ----------
function saveForm() {
  if (!$('#form')) return;
  form.car = $('#car').value.trim(); form.cardesc = $('#cardesc').value.trim(); form.name = $('#name').value.trim();
  form.phone = $('#phone').value.replace(/\D/g, ''); form.notes = $('#notes').value.trim();
}
function go(v) { saveForm(); view = v; render(); window.scrollTo(0, 0); }

async function placeOrder() {
  if (sending) return;
  saveForm();
  let ok = true;
  const bad = (id, cond) => { $('#' + id).classList.toggle('hidden', !cond); if (cond) ok = false; };
  bad('eCar', form.car.length < 1);
  bad('eName', form.name.length < 2);
  bad('ePhone', !/^[279]\d{7}$/.test(form.phone));
  if (!ok) { document.querySelector('.err:not(.hidden)')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (form.time === 'ASAP' && !isOpenNow()) return toast(L.eClosed);
  sending = true;
  const bar = $('#bar'); bar.disabled = true; bar.innerHTML = `<span>${L.sending}</span>`;
  try {
    const r = await api('place_order', {
      name: form.name, phone: '+968' + form.phone, car_plate: form.car.toUpperCase(), car_desc: form.cardesc,
      pickup: form.time, notes: form.notes, offers: true,
      items: [...cart.values()].map(l => ({ product_id: l.pid, qty: l.qty, ...(l.note ? { note: l.note } : {}) })),
    });
    store.set('kd_name', form.name); store.set('kd_phone', form.phone); store.set('kd_car', form.car); store.set('kd_cardesc', form.cardesc);
    store.set('kd_track', r.token);
    cart.clear(); form.notes = '';
    showTrack(r.token);
  } catch (ex) {
    toast(ex.message === 'too_many' ? L.eMany : ex.message === 'sold_out' ? L.eOut : ex.message === 'closed' ? L.eClosed : L.eFail);
    if (ex.message === 'sold_out') loadMenu();
  } finally {
    sending = false; bar.disabled = false; if (view === 'details') render();
  }
}

async function tick() {
  let o;
  try { o = await api('track', undefined, { t: trackToken }); }
  catch (ex) { if (ex.message === 'not_found') { store.del('kd_track'); clearInterval(trackTimer); track = null; trackToken = null; go('menu'); } return; }
  if (!o.today) store.del('kd_track');
  track = o;
  if (['done', 'cancelled'].includes(o.status)) { clearInterval(trackTimer); store.del('kd_track'); }
  if (view === 'track') render();
}
function showTrack(token) {
  trackToken = token; track = null; view = 'track'; render(); window.scrollTo(0, 0);
  clearInterval(trackTimer); tick(); trackTimer = setInterval(tick, 6000);
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#app').innerHTML = view === 'details' ? viewDetails() : view === 'track' ? viewTrack() : viewMenu();
  const { n, t } = totals(), bar = $('#bar');
  if (view === 'menu') {
    bar.classList.toggle('off', n === 0);
    bar.innerHTML = `<span>${L.view}<span class="cnt">${n}</span></span><span class="num">${money(t)} ${L.omr}</span>`;
    bar.onclick = openCart;
  } else if (view === 'details') {
    bar.classList.remove('off');
    bar.innerHTML = `<span>${L.confirm}</span><span class="num">${money(t)} ${L.omr}</span>`;
    bar.onclick = placeOrder;
  } else bar.classList.add('off');
}

$('#app').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]');
  if (c) { cat = c.dataset.cat; document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', String(b === c))); const sec = document.getElementById('sec-' + cat); if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - 64, behavior: 'smooth' }); return; }
  const g = e.target.closest('[data-g]');
  if (g) return openItem(products.filter(p => p.cat === g.dataset.c && p.name_en === g.dataset.g));
  if (e.target.closest('[data-time]')) { saveForm(); form.time = 'ASAP'; return render(); }
  if (e.target.closest('#lang')) { saveForm(); lang = lang === 'ar' ? 'en' : 'ar'; L = T[lang]; store.set('kd_lang', lang); return render(); }
  if (e.target.closest('#goBack')) return go('menu');
  const here = e.target.closest('#here');
  if (here) { here.disabled = true; api('arrived', { t: trackToken }).then(tick).catch(() => { here.disabled = false; }); return; }
  if (e.target.closest('#again')) { clearInterval(trackTimer); store.del('kd_track'); track = null; trackToken = null; return go('menu'); }
});
// The section chip follows the list while scrolling
let spyTick = false;
window.addEventListener('scroll', () => {
  if (view !== 'menu' || spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => {
    spyTick = false;
    let cur = null;
    for (const sec of document.querySelectorAll('.sec')) if (sec.getBoundingClientRect().top < 140) cur = sec.id.slice(4);
    if (!cur || cur === cat) return;
    cat = cur;
    for (const b of document.querySelectorAll('.cat')) {
      const on = b.dataset.cat === cur; b.setAttribute('aria-pressed', String(on));
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  });
}, { passive: true });
$('#app').addEventListener('input', e => {
  const map = { car: 'eCar', name: 'eName', phone: 'ePhone' };
  if (map[e.target.id]) document.getElementById(map[e.target.id])?.classList.add('hidden');
});
$('#app').addEventListener('change', e => { if (e.target.id === 'later') { saveForm(); form.time = e.target.value || 'ASAP'; render(); } });

async function loadMenu() {
  const [m, c, s] = await Promise.all([api('menu'), api('cats').catch(() => []), api('shop_info').catch(() => ({}))]);
  products = m; cats = Array.isArray(c) ? c : []; promo = s.promo || null; shopWa = s.whatsapp || ''; if (Number.isInteger(s.open_from)) openFrom = s.open_from;
  // Items not in a known section still show, at the end
  for (const p of products) if (p.cat && !cats.some(x => x.k === p.cat)) cats.push({ k: p.cat, en: p.cat, ar: p.cat });
  if (view === 'menu') render();
}

(async () => {
  render();
  const fromLink = new URLSearchParams(location.search).get('t');
  if (fromLink && /^[a-f0-9]{32}$/.test(fromLink)) { store.set('kd_track', fromLink); history.replaceState(null, '', location.pathname); }
  try { await loadMenu(); }
  catch { $('#app').innerHTML = header(false) + `<p class="lead" style="margin-top:30px">${L.loadErr}</p>`; return; }
  const saved = store.get('kd_track');
  if (saved && /^[a-f0-9]{32}$/.test(saved)) return showTrack(saved);
  render();
})();
</script>
