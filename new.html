<style>

:root{

  --bg:#FFFFFF; --card:#F8F3F7; --tile:#F0E4EE; --line:#EEE5EC; --ok:#2F7D4F; --bad:#B3261E;
  --f-ar:"Alexandria","Tajawal",system-ui,sans-serif; --f-en:"Jost","Montserrat",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ar);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.en{font-family:var(--f-en)}
.num{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-en);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}

.demo{background:var(--o);color:var(--ink);text-align:center;font-size:13px;font-weight:600;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 130px}
.top{display:flex;align-items:center;gap:8px;padding:16px 0 4px}
.top .logo{height:30px;width:auto;margin-inline-end:auto}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--p);font-weight:600;font-size:13px;text-decoration:none}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--p);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
[dir=ltr] #goBack svg{transform:scaleX(-1)}

h1{margin:8px 0 0;font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.lead{margin:4px 0 0;color:var(--sub);font-size:14px;line-height:1.6}
.head .eyebrow{color:var(--o2);margin-top:14px;display:block}

.promo{margin-top:16px;background:#FDF0DA;color:var(--ink);border-radius:18px;padding:12px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.promo b{background:var(--o);border-radius:99px;padding:2px 10px;font-family:var(--f-en)}

.feat{position:relative;margin-top:18px;min-height:240px;border-radius:28px;background:var(--card);overflow:hidden;display:flex;align-items:flex-end}
.feat .disc{position:absolute;width:176px;height:176px;border-radius:50%;background:var(--tile);inset-inline-end:-18px;top:50%;margin-top:-88px}
.feat img{position:absolute;inset-inline-end:8px;top:50%;height:160px;width:auto;transform:translateY(-50%) rotate(-6deg);filter:drop-shadow(0 18px 20px rgba(71,13,67,.18))}
[dir=ltr] .feat img{transform:translateY(-50%) rotate(6deg)}
.feat .in{position:relative;padding:20px;max-width:64%}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink);background:var(--o);border-radius:99px;padding:4px 10px}
.feat .name{font-size:19px;font-weight:800;line-height:1.35;margin-top:10px;text-wrap:balance}
.feat .desc{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.feat .row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.price{font-family:var(--f-en);font-weight:600;font-size:18px}
.price small{font-family:var(--f-ar);font-weight:500;font-size:12px;margin-inline-start:2px}
.was{font-family:var(--f-en);text-decoration:line-through;color:var(--sub);font-size:13px;margin-inline-start:6px}
.addbtn{white-space:nowrap;height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--p);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec h2{margin:0;font-size:20px;font-weight:600}
.sec .eyebrow{color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.card .ph{height:132px;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ph img{height:122px;width:auto}
.card .ph svg{width:56px;height:56px;color:var(--p);opacity:.5}
.card .nm{font-weight:600;font-size:14px;line-height:1.35;margin-top:4px;min-height:38px}
.card .bt{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .bt .price{font-size:15px;color:var(--o2)}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:20px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center}
.stepper{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:var(--card);color:var(--p);font-size:18px;line-height:1}
.stepper button.inc{background:var(--p);color:#fff}
.stepper span{min-width:18px;text-align:center;font-family:var(--f-en);font-weight:600}
.card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;padding:12px}
.card.wide .ph{width:100px;height:100px;flex:none}
.card.wide .ph img{height:92px}
.card.wide .txt{flex:1;min-width:0}
.card.wide .nm{min-height:0}
.card .sm{font-size:12px;color:var(--sub);line-height:1.5}

.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;z-index:20;height:62px;border-radius:999px;background:var(--p);color:#fff;border:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:600;font-size:16px;box-shadow:0 14px 30px rgba(71,13,67,.3);transition:transform .25s ease,opacity .25s}
.bar.off{transform:translateY(120px);opacity:0;pointer-events:none}
.bar .num{font-size:18px}
.bar .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:99px;background:var(--o);color:var(--ink);font-family:var(--f-en);font-size:14px;margin-inline-start:8px;padding:0 6px}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(42,10,39,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:#fff;width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{margin:6px 0 2px;font-size:22px;font-weight:800}
.sheet .x{float:inline-end;margin-top:4px}
.tops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.top-i{min-height:58px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:start}
.top-i .t{font-weight:600;font-size:14px}
.top-i .t small{display:block;font-family:var(--f-en);font-weight:500;color:var(--sub);font-size:12px}
.top-i .c{min-width:26px;height:26px;border-radius:99px;background:var(--o);font-family:var(--f-en);font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.top-i.on{border-color:var(--p);background:var(--card)}
.top-i .c:empty{display:none}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .ph{width:54px;height:60px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none}
.line .ph img{height:54px;width:auto}
.line .txt{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.4}
.line .txt .num{display:block;color:var(--o2);font-size:14px;margin-top:2px}
.sum{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 4px;font-size:15px;color:var(--sub)}
.sum.big{color:var(--ink);font-weight:800;font-size:19px;margin-top:6px}
.btn{width:100%;height:56px;border-radius:999px;border:0;background:var(--p);color:#fff;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.o{background:var(--o);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--line)}
.btn.wa{background:#25D366;color:#fff}
.btn:disabled{opacity:.45}
.btn.wallet{background:#000;color:#fff}
.btn.ghost.light{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.loy .acts{margin-top:14px}

/* details */
.steps{display:flex;gap:6px;margin-top:14px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--o)}
.form{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.field label{display:block;font-weight:600;font-size:13px;color:var(--sub);margin:0 4px 6px}
.field input,.field select,.field textarea{width:100%;min-height:54px;border:1.5px solid transparent;border-radius:16px;background:var(--card);padding:12px 16px;font-size:16px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);background:#fff}
.field textarea{min-height:84px;resize:vertical}
.field .err{color:var(--bad);font-size:12px;margin:6px 4px 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plate{direction:ltr;text-align:center;font-family:var(--f-en);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.phone{display:flex;gap:8px;direction:ltr}
.phone span{display:flex;align-items:center;padding:0 14px;border-radius:16px;background:var(--card);font-family:var(--f-en);font-weight:600}
.phone input{direction:ltr;text-align:left;font-family:var(--f-en)}
.times{display:flex;gap:8px;flex-wrap:wrap}
.time{min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.time[aria-pressed=true]{border-color:var(--p);background:var(--card)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:12px 16px;font-weight:600;font-size:14px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:#D9CFD7;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i::after{inset-inline-start:23px}
.where{display:flex;gap:12px;align-items:flex-start;background:#FDF0DA;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.6;margin-top:16px}
.where svg{flex:none;width:22px;height:22px;color:var(--o2);margin-top:2px}
.where a{color:var(--p);font-weight:600}
.review{background:var(--card);border-radius:20px;padding:14px 16px;margin-top:18px}
.review .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}

/* track */
.done{text-align:center;padding-top:20px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.tick svg{width:42px;height:42px;color:var(--ok)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ref{font-family:var(--f-en);font-weight:600;font-size:56px;line-height:1;margin-top:14px;letter-spacing:.02em}
.status{font-size:20px;font-weight:800;margin-top:8px}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:20px 0 6px}
.prog div{font-size:12px;font-weight:600;color:var(--sub);text-align:center}
.prog div i{display:block;height:6px;border-radius:9px;background:var(--line);margin-bottom:8px;transition:background .4s}
.prog div.on{color:var(--ink)}
.prog div.on i{background:var(--o)}
.prog div.past i{background:var(--ok)}
.info{background:var(--card);border-radius:20px;padding:14px 16px;margin-top:16px;text-align:start}
.info .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.loy{background:var(--p);color:#fff;border-radius:24px;padding:18px;margin-top:18px;text-align:start}
.loy .eyebrow{color:var(--l)}
.loy .t{font-size:17px;font-weight:600;margin-top:4px}
.stamps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.stamps i{width:34px;height:34px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-style:normal}
.stamps i.on{background:var(--o);border:0}
.stamps i svg{width:18px;height:18px;color:var(--ink)}
.stamps i.gift{border-color:var(--o);color:var(--o);font-size:10px;font-weight:600}
.loy .sm{font-size:12px;opacity:.8;margin-top:12px}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;animation:fade .2s}
@media (max-width:380px){.feat .name{font-size:17px}}
@media (max-width:350px){.grid{grid-template-columns:minmax(0,1fr)}.feat .in{max-width:68%}.feat .name{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

// ---------- sheets ----------
function sheet(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(bg);
  onMount && onMount(bg, close);
  bg.querySelector('button')?.focus();
  return close;
}

function openBuilder(pid) {
  const p = prod(pid); if (!p) return;
  const picked = new Map();
  const sum = () => p.price + [...picked].reduce((a, [id, c]) => a + (topById(id)?.price || 0) * c, 0);
  sheet(`<button type="button" class="iconbtn x" data-close aria-label="×">${ICON.x}</button>
    <h3>${esc(pname(p))}</h3><div class="lead">${L.tops} · ${L.topsSub}</div>
    <div class="tops">${toppings.map(t => `<button type="button" class="top-i" data-t="${t.id}"><span class="t">${esc(lang === 'ar' ? t.name_ar : t.name_en)}<small>${t.price > 0 ? '+' + money(t.price) : ''}</small></span><span class="c"></span></button>`).join('')}</div>
    <div class="sum"><span>${L.base}</span><span class="num">${money(p.price)}</span></div>
    <button type="button" class="btn" id="badd" style="margin-top:12px"></button>`, (bg, close) => {
    const upd = () => {
      bg.querySelectorAll('.top-i').forEach(b => { const c = picked.get(+b.dataset.t) || 0; b.classList.toggle('on', c > 0); b.querySelector('.c').textContent = c ? '×' + c : ''; });
      bg.querySelector('#badd').textContent = L.addTo(money(sum()) + ' ' + L.omr);
    };
    bg.addEventListener('click', e => {
      const b = e.target.closest('.top-i');
      if (b) { const id = +b.dataset.t, c = picked.get(id) || 0; if (c >= 3) picked.delete(id); else picked.set(id, c + 1); upd(); }
      if (e.target.closest('#badd')) {
        const tops = [...picked].flatMap(([id, c]) => Array(c).fill(id)).sort((a, b) => a - b);
        change(tops.length ? `${pid}:${tops.join('.')}` : String(pid), 1, pid, tops);
        close(); toast('✓ ' + pname(p));
      }
    });
    upd();
  });
}

// ---------- flow ----------
function isOpenNow() { const h = new Date().getHours(); return h >= 7; }
function buildTimes() {
  const now = new Date(), out = [];
  const t = new Date(now); t.setMinutes(Math.ceil((t.getMinutes() + 30) / 15) * 15, 0, 0);
  if (t.getHours() < 7) t.setHours(7, 0, 0, 0);
  while (t.getDate() === now.getDate() && out.length < 40) {
    const hh = t.getHours(), mm = String(t.getMinutes()).padStart(2, '0');
    const lbl = `${((hh + 11) % 12) + 1}:${mm} ${hh < 12 ? (lang === 'ar' ? 'ص' : 'AM') : (lang === 'ar' ? 'م' : 'PM')}`;
    out.push([`${String(hh).padStart(2, '0')}:${mm}`, lang === 'ar' ? arNum(lbl) : lbl]);
    t.setMinutes(t.getMinutes() + 15);
  }
  return out;
}

}
function go(v) { saveForm(); view = v; render(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); }

  if (sending) return;

  saveForm();
  let ok = true;
  const bad = (id, cond) => { $('#' + id).classList.toggle('hidden', !cond); if (cond) ok = false; };
  bad('eCar', form.car.length < 1);
  bad('eName', form.name.length < 2);
  bad('ePhone', !/^[279]\d{7}$/.test(form.phone));
  if (!ok) { document.querySelector('.err:not(.hidden)')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (form.time === 'ASAP' && !isOpenNow()) return toast(L.eClosed);
  sending = true;
  const bar = $('#bar'); bar.disabled = true; bar.innerHTML = `<span>${L.sending}</span>`;
  try {
    const r = await api('place_order', {
      name: form.name, phone: '+968' + form.phone, car_plate: form.car.toUpperCase(), car_desc: form.cardesc,
      pickup: form.time, notes: form.notes, offers: form.offers,
      items: [...cart.values()].map(l => ({ product_id: l.pid, qty: l.qty, toppings: l.tops })),
    });
    store.set('ad_name', form.name); store.set('ad_phone', form.phone); store.set('ad_car', form.car); store.set('ad_cardesc', form.cardesc);
    store.set('ad_offers', form.offers ? '1' : ''); store.set('ad_track', r.token); if (r.card) store.set('ad_card', r.card);
    cart.clear(); form.notes = '';
    showTrack(r.token);
  } catch (ex) {
    toast(ex.message === 'too_many' ? L.eMany : ex.message === 'closed' ? L.eClosed : L.eFail);
  } finally {
    sending = false; bar.disabled = false; if (view === 'details') render();
  }
}

async function tick() {
  let o;
  try { o = await api('track', undefined, { t: trackToken }); }
  catch (ex) { if (ex.message === 'not_found') { del('ad_track'); clearInterval(trackTimer); track = null; trackToken = null; go('menu'); } return; }
  if (!o.today) del('ad_track');
  if (o.loyalty && o.loyalty.card) store.set('ad_card', o.loyalty.card);
  track = o;
  if (['done', 'cancelled'].includes(o.status)) { clearInterval(trackTimer); del('ad_track'); }
  if (view === 'track') render();
}
function showTrack(token) {
  trackToken = token; track = null;
  view = 'track'; render(); window.scrollTo(0, 0);
  clearInterval(trackTimer);
  tick(); trackTimer = setInterval(tick, 6000);
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#demo').textContent = PREVIEW ? L.demo : '';
  $('#demo').classList.toggle('hidden', !PREVIEW);
  const app = $('#app');
  app.innerHTML = view === 'details' ? viewDetails() : view === 'track' ? viewTrack() : viewMenu();
  const { n, t } = totals(), bar = $('#bar');
  if (view === 'menu') {
    bar.classList.toggle('off', n === 0);
    bar.innerHTML = `<span>${L.view}<span class="cnt">${n}</span></span><span class="num">${money(t)} ${L.omr}</span>`;
    bar.onclick = openCart;
  } else if (view === 'details') {
    bar.classList.remove('off');
    bar.innerHTML = `<span>${L.confirm}</span><span class="num">${money(t)} ${L.omr}</span>`;
    bar.onclick = placeOrder;
  } else bar.classList.add('off');
}

// one listener for everything inside the page
$('#app').addEventListener('click', e => {
  const k = e.target.closest('[data-k]');
  if (k) return change(k.dataset.k, +k.dataset.d, +k.dataset.p);
  const f = e.target.closest('[data-f]');
  if (f) { filter = f.dataset.f; return render(); }
  const b = e.target.closest('[data-build]');
  if (b) return openBuilder(+b.dataset.build);
  const tm = e.target.closest('[data-time]');
  if (tm) { saveForm(); form.time = 'ASAP'; return render(); }
  if (e.target.closest('#lang')) { saveForm(); lang = lang === 'ar' ? 'en' : 'ar'; L = T[lang]; store.set('ad_lang', lang); return render(); }
  if (e.target.closest('#goBack')) return go('menu');
  const here = e.target.closest('#here');
  if (here) { here.disabled = true; api('arrived', { t: trackToken }).then(tick).catch(() => { here.disabled = false; }); return; }
  if (e.target.closest('#again')) { clearInterval(trackTimer); del('ad_track'); track = null; trackToken = null; return go('menu'); }
});
$('#app').addEventListener('input', e => {
  const map = { car: 'eCar', name: 'eName', phone: 'ePhone' };
  if (map[e.target.id]) document.getElementById(map[e.target.id])?.classList.add('hidden');
});
$('#app').addEventListener('change', e => {
  if (e.target.id === 'later') { saveForm(); form.time = e.target.value || 'ASAP'; render(); }
});

(async () => {
  render();
  // Tracking link sent by the shop (…/?t=<token>) opens that order even after the page was closed
  const fromLink = new URLSearchParams(location.search).get('t');
  if (fromLink && /^[a-f0-9]{32}$/.test(fromLink)) { store.set('ad_track', fromLink); history.replaceState(null, '', location.pathname); }
  try {
    const [m, t, s] = await Promise.all([api('menu', undefined, PREVIEW ? { preview: '1' } : {}), api('toppings').catch(() => []), api('shop_info').catch(() => ({}))]);
    products = m; toppings = Array.isArray(t) ? t : []; promo = s.promo || null; shopWa = s.whatsapp || '';
  } catch {
    $('#app').innerHTML = header(false) + `<p class="lead" style="margin-top:30px">${L.loadErr}</p>`;
    return;
  }
  const saved = store.get('ad_track');
  if (saved && /^[a-f0-9]{32}$/.test(saved)) return showTrack(saved);
  render();
})();
</script>
</body>
