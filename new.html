function buildTimes() {
  const sel = $('#time'), now = new Date(), opts = [];
  if (now.getHours() >= 7) opts.push(['ASAP', L.asap]);
  const t = new Date(now); t.setMinutes(Math.ceil((t.getMinutes() + 30) / 15) * 15, 0, 0);
  if (t.getHours() < 7) t.setHours(7, 0, 0, 0);
  while (t.getDate() === now.getDate() && opts.length < 40) {
    const hh = t.getHours(), mm = String(t.getMinutes()).padStart(2, '0');
    opts.push([`${String(hh).padStart(2, '0')}:${mm}`, L.num(`${((hh + 11) % 12) + 1}:${mm}`) + ' ' + (hh < 12 ? L.am : L.pm)]);
    t.setMinutes(t.getMinutes() + 15);
  }
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('#closed').classList.toggle('hidden', opts.length > 0);
  return opts.length > 0;
}
const isOpen = () => $('#time').options.length > 0;
const pname = p => lang === 'ar' ? p.name_ar : p.name_en;

const prod = id => products.find(p => p.id === id);
const pdesc = p => (lang === 'ar' ? p.desc_ar : p.desc_en) || '';
const topById = id => toppings.find(t => t.id === id);
const lineUnit = l => (prod(l.pid) ? prod(l.pid).price : 0) + l.tops.reduce((a, id) => a + (topById(id) ? topById(id).price : 0), 0);
const lineName = l => {
  const p = prod(l.pid); if (!p) return '';
  const cnt = {}; l.tops.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
  const names = Object.keys(cnt).map(Number).sort((a, b) => a - b).map(id => [topById(id), cnt[id]]).filter(([t]) => t)
    .map(([t, c]) => (lang === 'ar' ? t.name_ar : t.name_en) + (c > 1 ? ' ×' + L.num(c) : ''));
  return pname(p) + (names.length ? ` (${names.join(lang === 'ar' ? '، ' : ', ')})` : '');
};
const qtyBtns = (key, q, label) => `<div class="qty">
  ${q ? `<button type="button" data-key="${key}" data-d="-1" aria-label="${L.less} ${esc(label)}">−</button><span aria-live="polite">${L.num(q)}</span>` : ''}
  <button type="button" class="add" data-key="${key}" data-d="1" aria-label="${L.add} ${esc(label)}">+</button></div>`;

function render() {
  $('#menu').innerHTML = products.map(p => {
    const main = lang === 'ar' ? `<div class="ar lal">${esc(p.name_ar)}</div><div class="en mon">${esc(p.name_en)}</div>`
                               : `<div class="ar mon" style="font-weight:800;font-size:19px">${esc(p.name_en)}</div><div class="en" dir="rtl">${esc(p.name_ar)}</div>`;
    const desc = pdesc(p) ? `<div class="desc">${esc(pdesc(p))}</div>` : '';
    const isBowl = p.kind === 'bowl' || p.kind === 'build';
    if (p.kind === 'build') {
      const lines = [...cart.entries()].filter(([, l]) => l.pid === p.id);
      return `<div class="card"><div class="item bowl">
        ${p.img && !/^bowl/.test(p.img) ? `<img src="assets/${esc(p.img)}" alt="">` : ''}

        <div style="padding:0 14px 14px"><button type="button" class="btn orange build" data-build="${p.id}" style="width:100%">${L.build}</button></div>
        ${lines.length ? `<div class="blines">${lines.map(([k, l]) => `<div class="bline"><div class="t">${esc(lineName(l))}<br><span class="mon">${money(lineUnit(l))}</span> ${L.omr}</div>${qtyBtns(k, l.qty, lineName(l))}</div>`).join('')}</div>` : ''}
      </div>`;
    }
    const key = String(p.id), q = cart.get(key) ? cart.get(key).qty : 0;
    return `<div class="card item${isBowl ? ' bowl' : ''}${p.best ? ' top' : ''}">
      ${isBowl && (!p.img || /^bowl/.test(p.img)) ? '' : `<img src="assets/${esc(p.img || 'cup-smoothie.png')}" alt="">`}

      ${qtyBtns(key, q, pname(p))}</div>`;
  }).join('');
  let n = 0, tot = 0, bowls = false;
  for (const l of cart.values()) { n += l.qty; tot += l.qty * lineUnit(l); const p = prod(l.pid); if (p && p.kind !== 'cup') bowls = true; }
  $('#total').textContent = money(tot);
  $('#count').textContent = n ? (bowls ? L.items(n) : L.cups(n)) : L.none;
  $('#next').disabled = n === 0 || !isOpen() || PREVIEW;
}

// ---------- build your bowl ----------
function openBuilder(pid) {
  const p = prod(pid); if (!p) return;
  const picked = new Map();   // topping id -> how many (1 to 3)
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bt">
    <button type="button" class="x" aria-label="×">×</button>
    <h2 id="bt" class="lal">${esc(pname(p))}</h2>
    <div style="font-weight:700;opacity:.75">${L.tops}</div>
    <div class="chips">${toppings.map(t => `<div class="chipw"><button type="button" class="chip" data-t="${t.id}" aria-pressed="false"><span>${esc(lang === 'ar' ? t.name_ar : t.name_en)}</span><small class="mon">${t.price > 0 ? '+' + money(t.price) : ''}</small><b class="cnt"></b></button><button type="button" class="minus hidden" data-m="${t.id}" aria-label="${L.less} ${esc(lang === 'ar' ? t.name_ar : t.name_en)}">−</button></div>`).join('')}</div>
    <div class="total"><span>${L.baseBowl} <span class="mon">${money(p.price)}</span></span><span><span class="mon" id="btot"></span> ${L.omr}</span></div>
    <button type="button" class="btn" id="badd" style="width:100%"></button>
  </div>`;
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  const sum = () => p.price + [...picked].reduce((a, [id, c]) => a + (topById(id) ? topById(id).price * c : 0), 0);
  const upd = () => { bg.querySelector('#btot').textContent = money(sum()); bg.querySelector('#badd').textContent = L.addTo(money(sum()) + ' ' + L.omr); };
  const close = () => { bg.remove(); document.body.style.overflow = ''; };
  bg.querySelector('.x').onclick = close;
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  const show = id => {
    const n = picked.get(id) || 0;
    const chip = bg.querySelector(`.chip[data-t="${id}"]`);
    chip.setAttribute('aria-pressed', String(n > 0));
    chip.querySelector('.cnt').textContent = n > 1 ? '×' + L.num(n) : '';
    bg.querySelector(`.minus[data-m="${id}"]`).classList.toggle('hidden', n === 0);
    upd();
  };
  bg.querySelector('.chips').addEventListener('click', e => {
    const m = e.target.closest('.minus');
    if (m) { const id = +m.dataset.m, n = (picked.get(id) || 0) - 1; n > 0 ? picked.set(id, n) : picked.delete(id); return show(id); }
    const c = e.target.closest('.chip'); if (!c) return;
    const id = +c.dataset.t, n = Math.min(3, (picked.get(id) || 0) + 1);
    picked.set(id, n); show(id);
  });
  bg.querySelector('#badd').onclick = () => {
    const tops = [...picked].flatMap(([id, c]) => Array(c).fill(id)).sort((a, b) => a - b), key = `${pid}:${tops.join('.')}`;
    const cur = cart.get(key); cart.set(key, { pid, qty: Math.min(20, (cur ? cur.qty : 0) + 1), tops });
    close(); render();
  };
  upd();
}

function goStep(s, quiet) {
  step = s;
  $('#step1').classList.toggle('hidden', s !== 1);
  $('#step2').classList.toggle('hidden', s !== 2);
  $('#s1').classList.toggle('on', s === 1); $('#s2').classList.toggle('on', s === 2);
  $('#back').classList.toggle('hidden', s !== 2);
  $('#next').textContent = s === 1 ? L.next : L.send;
  $('#htitle').textContent = s === 1 ? L.pick : L.details;
  if (!quiet) $('#err').textContent = '';
  if (s === 2) {
    $('#summary').innerHTML = [...cart.values()].map(l =>
      `<div class="l"><span>${L.num(l.qty)}× ${esc(lineName(l))}</span><span class="mon">${money(l.qty * lineUnit(l))}</span></div>`).join('')
      + `<button type="button" id="edit">${L.edit}</button>`;
    $('#edit').onclick = () => goStep(1);
    if (!quiet) {
      for (const k of ['name', 'phone', 'car', 'cardesc']) { const v = store.get('ad_' + k); if (v && !$('#' + k).value) $('#' + k).value = v; }
      if (store.get('ad_offers')) $('#offers').checked = true;
      setTimeout(() => ($('#car').value ? $('#name') : $('#car')).focus(), 50);
    }
  }
  if (!quiet) window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('#menu').addEventListener('click', e => {
  const bb = e.target.closest('button[data-build]'); if (bb) return openBuilder(+bb.dataset.build);
  const b = e.target.closest('button[data-key]'); if (!b) return;
  const key = b.dataset.key, cur = cart.get(key) || { pid: +key.split(':')[0], qty: 0, tops: [] };
  const q = Math.max(0, Math.min(20, cur.qty + +b.dataset.d));
  q ? cart.set(key, { ...cur, qty: q }) : cart.delete(key);
  render();
});

$('#next').addEventListener('click', async () => {
  if (PREVIEW) { $('#err').textContent = L.previewNo; return; }

  if (!car) { err.textContent = L.eCar; $('#car').focus(); return; }
  if (name.length < 2) { err.textContent = L.eName; $('#name').focus(); return; }
  if (!/^[279]\d{7}$/.test(phone)) { err.textContent = L.ePhone; $('#phone').focus(); return; }
  if (!isOpen()) { err.textContent = L.eClosed; return; }
  const btn = $('#next'); btn.disabled = true; btn.textContent = L.sending;
  try {
    const r = await api('place_order', {
      name, phone: '+968' + phone, car_plate: car.toUpperCase(), car_desc: $('#cardesc').value.trim(),
      pickup: $('#time').value, notes: $('#notes').value, offers: $('#offers').checked, items: [...cart.values()].map(l => ({ product_id: l.pid, qty: l.qty, toppings: l.tops })),
    });
    store.set('ad_name', name); store.set('ad_phone', phone); store.set('ad_car', car); store.set('ad_cardesc', $('#cardesc').value.trim());
    store.set('ad_track', r.token); if (r.card) store.set('ad_card', r.card); store.set('ad_offers', $('#offers').checked ? '1' : '');
    showTrack(r.token);
  } catch (ex) {
    err.textContent = ex.message === 'too_many' ? L.eMany : ex.message === 'closed' ? L.eClosed : L.eFail;
    btn.disabled = false; btn.textContent = L.send;
  }
});

// ---------- loyalty ----------
function loyaltyBox(l) {
  const dots = Array.from({ length: l.need }, (_, i) => `<i class="${l.free > 0 || i < l.stamps ? 'on' : ''}"></i>`).join('')
    + `<i class="gift ${l.free > 0 ? 'on' : ''}">${L.freeTag}</i>`;
  const left = l.need - l.stamps;
  const msg = l.free > 0 ? L.loyFree(l.free) : (l.unit === 'order' ? L.loyLeftO(left) : L.loyLeft(left));
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return `<div class="loy">
    <div class="lal" style="font-size:22px">${L.loyT}</div>
    <div class="stamps" aria-label="${esc(msg)}">${dots}</div>
    <div style="font-weight:800">${msg}</div>
    <div style="font-size:14px;opacity:.75;font-weight:700">${L.loyNote}</div>
    ${l.gwallet && !ios ? `<a class="wallet" href="api/gwallet.php?c=${esc(l.card)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M16 14h2"/></svg>${L.addGWallet}</a>` : ''}
    ${l.wallet && ios ? `<a class="wallet" href="api/wallet.php?c=${esc(l.card)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M16 14h2"/></svg>${L.addWallet}</a>` : ''}
    <a class="btn ghost small" href="card.html?c=${esc(l.card)}">${L.openCard}</a>
  </div>`;
}

// ---------- order tracking ----------
const ST = ['new', 'preparing', 'ready', 'done'];
let trackTimer = null;

async function tick() {
  let o;
  try { o = await api('track', undefined, { t: trackToken }); }
  catch (ex) { if (ex.message === 'not_found') { store.del('ad_track'); location.reload(); } return; }
  if (!o.today) store.del('ad_track');
  $('#htitle').textContent = L.yours;
  const idx = ST.indexOf(o.status);
  $('#track').innerHTML = `
    <div style="font-weight:700">${L.yourNo}</div>
    <div class="num" dir="ltr">#${esc(o.ref)}</div>
    <div class="st lal">${L.st[o.status]}</div>
    ${o.status !== 'cancelled' ? `<div class="prog">${L.steps.map((l, i) =>
      `<div class="${i < idx ? 'done on' : i === idx ? 'on' : ''}"><i></i>${l}</div>`).join('')}</div>` : ''}
    ${o.free_cups ? `<div class="freebox">${L.usedFree(money(o.discount))}</div>` : ''}
    <div style="font-weight:700;line-height:1.7">${L.carL}: <b dir="ltr" style="unicode-bidi:isolate">${esc(o.car_plate || '')}</b><br>${L.amount}: <span class="mon">${money(o.total)}</span> ${L.omr}, ${L.payOn}</div>
    ${['new', 'preparing', 'ready'].includes(o.status) ? (o.arrived
      ? `<div class="btn here" style="background:var(--ok)" role="status">${L.told}</div>`
      : `<button class="btn orange here" id="here" type="button">${L.here}</button>`) : ''}
    ${shopWa ? `<a class="btn wa" href="${esc(waLink(L.waOrder('#' + o.ref)))}" target="_blank" rel="noopener">${L.wa}</a>` : ''}
    <a class="btn ghost" href="https://maps.app.goo.gl/YEWkdU1vi8ZtnJua8" target="_blank" rel="noopener">${L.shop}</a>
    ${['done', 'cancelled'].includes(o.status) ? `<button class="btn" id="again" type="button">${L.again}</button>` : ''}
    ${o.loyalty && o.loyalty.on ? loyaltyBox(o.loyalty) : ''}`;
  if (o.loyalty && o.loyalty.card) store.set('ad_card', o.loyalty.card);
  const here = $('#here');
  if (here) here.addEventListener('click', async e => {
    e.target.disabled = true;
    try { await api('arrived', { t: trackToken }); tick(); } catch { e.target.disabled = false; }
  });
  const again = $('#again');
  if (again) again.addEventListener('click', () => { store.del('ad_track'); location.reload(); });
  if (['done', 'cancelled'].includes(o.status)) { clearInterval(trackTimer); store.del('ad_track'); }
}

function showTrack(token) {
  trackToken = token;
  const bar = $('#bar'); if (bar) bar.remove();
  const steps = $('#steps'); if (steps) steps.remove();
  $('#htitle').textContent = L.yours;
  $('#main').innerHTML = `<div class="card track" id="track" aria-live="polite">…</div>`;
  showWaFab();
  tick(); trackTimer = setInterval(tick, 6000);
  window.scrollTo({ top: 0 });
}

(async () => {
  applyLang();
  api('shop_info').then(r => {
    shopWa = (r && r.whatsapp) || ''; showWaFab();
    if (r && r.promo && !document.querySelector('.promo')) {
      const b = document.createElement('div'); b.className = 'promo';
      b.textContent = lang === 'ar' ? r.promo.ar : r.promo.en;
      $('#step1').prepend(b);
    }
  }).catch(() => {});
  // Tracking link sent by the shop (…/?t=<token>) opens that order even after the page was closed
  const fromLink = new URLSearchParams(location.search).get('t');
  if (fromLink && /^[a-f0-9]{32}$/.test(fromLink)) { store.set('ad_track', fromLink); history.replaceState(null, '', location.pathname); }
  const saved = store.get('ad_track');
  if (saved && /^[a-f0-9]{32}$/.test(saved)) return showTrack(saved);
  if (PREVIEW) { const bar = document.createElement('div'); bar.className = 'preview'; bar.textContent = L.preview; document.body.prepend(bar); }
  try {
    const [m, t] = await Promise.all([api('menu', undefined, PREVIEW ? { preview: '1' } : {}), api('toppings').catch(() => [])]);
    products = [...m.filter(p => p.best), ...m.filter(p => !p.best)]; toppings = Array.isArray(t) ? t : [];
  }
  catch { $('#menu').innerHTML = `<div class="card item">${L.eMenu}</div>`; return; }
  render();
})();

})();
</script>
