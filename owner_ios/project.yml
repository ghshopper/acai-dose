# Native SwiftUI owner app. The Xcode project is generated in CI with XcodeGen (xcodegen generate).
name: AcaiOwner
options:
  bundleIdPrefix: com.acaidose
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  AcaiOwner:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: AcaiWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Açaí Dose"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.acaidose.owner.refresh]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.acaidose.owner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acaidose.owner
        PRODUCT_NAME: AcaiOwner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AcaiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Açaí Dose"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.acaidose.owner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acaidose.owner.widgets
        PRODUCT_NAME: AcaiWidgets
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  AcaiOwner:
    build:
      targets:
        AcaiOwner: all
        AcaiWidgets: all
    archive:
      config: Release
