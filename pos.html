<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS | Açaí Dose</title>
<meta name="theme-color" content="#470D43">
<link rel="icon" href="assets/logo-purple.png">
<link rel="stylesheet" href="assets/app.css?v=1791725119">
<style>
body{background:var(--c2);font-family:'Montserrat','Tajawal',system-ui,sans-serif}
.topbar .nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.topbar .btn.ghost{color:var(--c);border-color:var(--c)}
.pos{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;padding:14px;align-items:start}
@media (max-width:860px){.pos{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.prod{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:3px solid transparent;cursor:pointer;text-align:center;min-height:220px;font:inherit;color:inherit}
.prod:active{transform:scale(.97)}
.prod:focus-visible{outline:3px solid var(--o)}
.prod img{height:120px;width:auto}
.prod .nm{font-weight:800;font-size:16px;line-height:1.25}
.prod .pr{font-weight:800;font-size:18px;color:var(--p)}
.prod .q{position:relative}
.prod .cnt{position:absolute;top:-6px;right:-30px;min-width:34px;height:34px;border-radius:17px;background:var(--o);color:var(--p);font-weight:800;display:grid;place-items:center}
.ticket{padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.ticket h2{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.lines{display:flex;flex-direction:column;gap:8px;min-height:60px}
.line{display:flex;align-items:center;gap:8px;font-weight:700}
.line .n{flex:1}
.line button{width:40px;height:40px;border-radius:50%;border:2px solid var(--p);background:#fff;font-weight:800;font-size:20px;cursor:pointer}
.line .qq{min-width:24px;text-align:center;font-weight:800}
.line .t{min-width:64px;text-align:right;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed #eadfca;padding-top:12px}
.total b{font-size:32px}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybtns .btn{min-height:64px;font-size:20px}
.appbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.appbtns .btn{min-height:52px;font-size:15px;padding:8px 6px;background:#fff;color:var(--p);border:2px solid var(--p)}
.appbtns .btn:not(:disabled):hover{background:var(--c2)}
.sub{font-size:13px;font-weight:800;opacity:.7;margin-bottom:-4px}
.change{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.change input{width:120px;min-height:46px;border:2px solid #e3d6bf;border-radius:12px;padding:6px 10px;font-size:18px}
.cust{display:flex;flex-direction:column;gap:6px;background:var(--c);border-radius:14px;padding:10px 12px}
.cust .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cust input{width:150px;min-height:46px;border:2px solid #e3d6bf;border-radius:12px;padding:6px 10px;font-size:18px;direction:ltr}
.cust .info{font-weight:700;font-size:15px}
.cust .free{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--p);background:var(--o);border-radius:10px;padding:8px 10px;cursor:pointer}
.cust .free input{width:22px;height:22px;min-height:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:800;font-size:20px;padding:16px 28px;border-radius:999px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.today{margin:0 14px 30px}
.today h3{margin:6px 4px 10px;font-size:20px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.today h3 small{font-size:14px;font-weight:700;opacity:.8}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0e6d4;white-space:nowrap}
th{background:var(--c);font-size:13px}
.void{background:none;border:0;color:var(--bad);font-weight:800;cursor:pointer;min-height:40px}
.x td{text-decoration:line-through;opacity:.5}
.tbl{overflow-x:auto}
</style>
<script>
/* Shows the reason instead of a blank page when a script fails (e.g. an old device browser). */
(function(){var shown=false;function show(t){if(shown)return;shown=true;var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 12px 12px 12px;z-index:99999;background:#470D43;color:#FAF3E0;padding:14px 16px;border-radius:14px;font:15px/1.5 system-ui,sans-serif;direction:ltr;text-align:left';d.innerHTML='<b>Page could not start.</b><br>'+String(t).replace(/</g,'&lt;')+'<br><small>'+navigator.userAgent.replace(/</g,'&lt;')+'</small>';(document.body||document.documentElement).appendChild(d);}
window.addEventListener('error',function(e){show(e.message||'Script error')});window.addEventListener('unhandledrejection',function(e){show((e.reason&&e.reason.message)||e.reason)});
setTimeout(function(){if(!window.__appStarted)show('The page script did not run. Update Android System WebView / Chrome on this device.')},6000);})();
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import { api, $, esc, money, requireLogin, logout, msgEn, watchNewOrders } from './assets/common.js?v=1791725119';
window.__appStarted = true;
(async () => {
const app = $('#app');
const me = await requireLogin(app, 'POS', true);

app.innerHTML = `
<header class="topbar">
  <img src="assets/logo-cream.png" alt="Açaí Dose">
  <div class="nav">
    <span class="who">${esc(me.username)}</span>
    <a class="btn small ghost" href="screen.html">Orders screen</a>
    ${me.role === 'owner' ? '<a class="btn small ghost" href="dashboard.html">Dashboard</a>' : ''}
    <button class="btn small ghost" id="out" type="button">Log out</button>
  </div>
</header>
<div class="pos">
  <section aria-label="Menu"><div class="grid" id="grid"><div class="card" style="padding:20px">Loading menu…</div></div></section>
  <aside class="card ticket" aria-label="Current sale">
    <h2>Current sale <button class="btn small ghost" id="clear" type="button">Clear</button></h2>
    <div class="lines" id="lines"></div>
    <div class="total"><span style="font-weight:800">Total</span><span><b id="tot">0.000</b> OMR</span></div>
    <div class="cust">
      <div class="row"><label for="cphone" style="font-weight:800">Customer mobile <small style="font-weight:600;opacity:.7">(optional, loyalty)</small></label>
        <input id="cphone" type="tel" inputmode="numeric" maxlength="8" placeholder="9XXXXXXX" autocomplete="off"></div>
      <div class="info" id="cinfo" aria-live="polite"></div>
    </div>
    <div class="change"><label for="given" style="font-weight:800">Cash given</label><input id="given" type="number" step="0.001" min="0" inputmode="decimal"><span id="chg" style="font-weight:800"></span></div>
    <div class="sub">In-shop payment</div>
    <div class="paybtns">
      <button class="btn pay" data-pay="cash" type="button" disabled>Cash</button>
      <button class="btn orange pay" data-pay="card" type="button" disabled>Card</button>
    </div>
    <div class="sub">Delivery app order</div>
    <div class="appbtns">
      <button class="btn pay" data-pay="talabat" type="button" disabled>Talabat</button>
      <button class="btn pay" data-pay="snoonu" type="button" disabled>Snoonu</button>
      <button class="btn pay" data-pay="khedmah" type="button" disabled>Khedmah</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </aside>
</div>
<section class="today">
  <h3>Today's shop sales <small id="sum"></small></h3>
  <div class="tbl" id="todayTbl"></div>
</section>`;
$('#out').onclick = logout;
watchNewOrders();

let products = [];
const cart = new Map();

function drawGrid() {
  $('#grid').innerHTML = products.map(p => {
    const q = cart.get(p.id) || 0;
    return `<button class="card prod" type="button" data-id="${p.id}" aria-label="Add ${esc(p.name_en)}">
      <span class="q"><img src="assets/${esc(p.img || 'cup-smoothie.png')}" alt="">${q ? `<span class="cnt">${q}</span>` : ''}</span>
      <span class="nm">${esc(p.name_en)}</span><span class="pr">${money(p.price)}</span></button>`;
  }).join('');
}
let cust = null;   // loyalty info for the typed mobile
function subtotal() { return products.reduce((s, p) => s + (cart.get(p.id) || 0) * p.price, 0); }
function freeOn() { const f = $('#usefree'); return !!(f && f.checked && cust && cust.free > 0); }
function discount() { if (!freeOn()) return 0; const inCart = products.filter(p => cart.get(p.id)); return inCart.length ? Math.max(...inCart.map(p => p.price)) : 0; }
function total() { return Math.max(0, subtotal() - discount()); }
function drawCust() {
  const box = $('#cinfo');
  if (!cust) { box.innerHTML = ''; return; }
  if (!cust.on) { box.textContent = cust.found ? `${cust.name || 'Customer'} (loyalty is off)` : 'New customer'; return; }
  const who = cust.found ? esc(cust.name || 'Customer') : 'New customer';
  box.innerHTML = `${who} · Stamps <b>${cust.stamps}/${cust.need}</b>` +
    (cust.free > 0 ? `<label class="free"><input type="checkbox" id="usefree"> Use FREE cup (${cust.free} available)</label>` : ' · Stamps are added for Cash / Card');
  const f = $('#usefree'); if (f) f.onchange = drawTicket;
}
let lookupT = null;
$('#cphone').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
  cust = null; drawCust(); drawTicket(); clearTimeout(lookupT);
  const v = e.target.value;
  if (/^[279]\d{7}$/.test(v)) lookupT = setTimeout(async () => {
    try { cust = await api('pos_customer', undefined, { phone: '+968' + v }); } catch { cust = null; }
    if ($('#cphone').value === v) { drawCust(); drawTicket(); }
  }, 250);
});
function drawTicket() {
  const rows = products.filter(p => cart.get(p.id));
  $('#lines').innerHTML = rows.length ? rows.map(p => {
    const q = cart.get(p.id);
    return `<div class="line"><span class="n">${esc(p.name_en)}</span>
      <button type="button" data-d="-1" data-id="${p.id}" aria-label="Remove one">−</button><span class="qq">${q}</span>
      <button type="button" data-d="1" data-id="${p.id}" aria-label="Add one">+</button><span class="t">${money(q * p.price)}</span></div>`;
  }).join('') : '<div style="opacity:.6;font-weight:700">Tap a drink to add it</div>';
  const t = total(), dsc = discount();
  $('#tot').textContent = money(t) + (dsc ? ` (−${money(dsc)} free cup)` : '');
  document.querySelectorAll('.pay').forEach(b => { b.disabled = t === 0; });
  const g = parseFloat($('#given').value);
  $('#chg').textContent = g && t ? (g >= t ? `Change: ${money(g - t)}` : `Short: ${money(t - g)}`) : '';
}
function redraw() { drawGrid(); drawTicket(); }

$('#grid').addEventListener('click', e => {
  const b = e.target.closest('.prod'); if (!b) return;
  const id = +b.dataset.id; cart.set(id, (cart.get(id) || 0) + 1); redraw();
});
$('#lines').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const id = +b.dataset.id, q = (cart.get(id) || 0) + +b.dataset.d;
  q > 0 ? cart.set(id, q) : cart.delete(id); redraw();
});
function resetSale() { cart.clear(); $('#given').value = ''; $('#cphone').value = ''; cust = null; drawCust(); redraw(); }
$('#clear').onclick = resetSale;
$('#given').oninput = drawTicket;

async function sell(payment) {
  const items = [...cart].map(([product_id, qty]) => ({ product_id, qty }));
  document.querySelectorAll('.pay').forEach(b => { b.disabled = true; }); $('#err').textContent = '';
  try {
    const ph = $('#cphone').value;
    if (ph && !/^[279]\d{7}$/.test(ph)) { $('#err').textContent = 'Customer mobile must be 8 digits (or leave it empty)'; drawTicket(); return; }
    const shop = payment === 'cash' || payment === 'card';
    const r = await api('pos_sale', { items, payment, phone: ph && shop ? '+968' + ph : '', use_free: shop && freeOn() });
    resetSale();
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
    t.textContent = `Sale #${r.ref} saved · ${money(r.total)} OMR (${payment})` + (r.loyalty ? ` · Stamps ${r.loyalty.stamps}/${r.loyalty.need}${r.loyalty.free ? ' · FREE cup ready' : ''}` : '');
    document.body.append(t); setTimeout(() => t.remove(), 2500);
    loadToday();
  } catch (ex) {
    if (ex.message === 'login_required') return location.reload();
    $('#err').textContent = msgEn(ex); drawTicket();
  }
}
document.querySelectorAll('.pay').forEach(b => { b.onclick = () => sell(b.dataset.pay); });

async function loadToday() {
  let rows = [];
  try { rows = await api('pos_today'); } catch (ex) { if (ex.message === 'login_required') location.reload(); return; }
  const ok = rows.filter(r => r.status !== 'cancelled');
  const sum = k => ok.filter(r => !k || r.payment === k).reduce((s, r) => s + r.total, 0);
  const apps = ['talabat', 'snoonu', 'khedmah'].map(k => [k, sum(k)]).filter(x => x[1]).map(([k, v]) => ` · ${k[0].toUpperCase() + k.slice(1)} ${money(v)}`).join('');
  $('#sum').textContent = `${ok.length} sales · Total ${money(sum())} · Cash ${money(sum('cash'))} · Card ${money(sum('card'))}${apps}`;
  $('#todayTbl').innerHTML = rows.length ? `<table>
    <thead><tr><th>Time</th><th>#</th><th>Items</th><th>Total</th><th>Paid</th><th>By</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.status === 'cancelled' ? 'x' : ''}"><td>${r.created_at.slice(11, 16)}</td><td>#${esc(r.ref)}</td>
      <td>${r.items.map(i => `${i.qty}× ${esc(i.name_en)}`).join(', ')}${r.free_cups ? ' <b>(1 free)</b>' : ''}${r.phone ? ` · ${esc(r.phone.slice(-4))}` : ''}</td><td>${money(r.total)}</td><td>${esc(r.payment || '')}</td><td>${esc(r.by_user || '')}</td>
      <td>${r.status === 'cancelled' ? 'Voided' : `<button class="void" type="button" data-void="${r.id}">Void</button>`}</td></tr>`).join('')}</tbody></table>`
    : '<div class="card" style="padding:18px;font-weight:700;opacity:.7">No shop sales yet today</div>';
}
document.addEventListener('click', async e => {
  const v = e.target.closest('[data-void]'); if (!v) return;
  if (!confirm('Void this sale?')) return;
  try { await api('pos_void', { id: +v.dataset.void }); loadToday(); } catch (ex) { alert(msgEn(ex)); }
});

try { products = await api('menu'); } catch { $('#grid').innerHTML = '<div class="card" style="padding:20px">Could not load menu. Refresh the page.</div>'; }
redraw(); loadToday();

})();
</script>
</body>
</html>
